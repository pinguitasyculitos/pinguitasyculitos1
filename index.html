<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Control Room English</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600;700&family=Saira+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Radio de planta: lo que llega es una transmisión entrante (escuchar), lo que dices es tu transmisión (hablar).
   Concreto frío de fondo, naranja de chaleco reflectivo para la acción, azul de canal para el audio. Una columna en el celular. */
:root{
  --bg:#E9EDF1; --card:#F8FAFB; --card2:#DFE5EB; --line:#C2CBD4; --ink:#14202B; --ink2:#4A5866;
  --accent:#B93D0C; --accent-ink:#FFFFFF; --accent-bg:#FBE4D6; --radio:#0E5A86; --radio-bg:#DCEAF4;
  --ok:#1E7347; --ok-bg:#D8EEE1; --warn:#8A5D00; --warn-bg:#F6E8C3; --bad:#B42318; --bad-bg:#F8DBD7;
  --display:"Saira Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --navh:64px;
  --lcd-bg:#0E1A12; --lcd-fg:#A6F0A9; --lcd-edge:#2A3A2D; --lcd-tx:#FFB27A;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10161C; --card:#18212A; --card2:#212C37; --line:#34414E; --ink:#E5EBF0; --ink2:#9BA9B6;
    --accent:#FF8A4C; --accent-ink:#1A0E07; --accent-bg:#3B2216; --radio:#74BCE6; --radio-bg:#16303F;
    --ok:#62C793; --ok-bg:#163020; --warn:#E3B64B; --warn-bg:#33290F; --bad:#F2857A; --bad-bg:#3B1C19; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10161C; --card:#18212A; --card2:#212C37; --line:#34414E; --ink:#E5EBF0; --ink2:#9BA9B6;
  --accent:#FF8A4C; --accent-ink:#1A0E07; --accent-bg:#3B2216; --radio:#74BCE6; --radio-bg:#16303F;
  --ok:#62C793; --ok-bg:#163020; --warn:#E3B64B; --warn-bg:#33290F; --bad:#F2857A; --bad-bg:#3B1C19; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--radio);outline-offset:2px}
a{color:var(--radio)}
.app{max-width:900px;margin:0 auto;padding-inline:16px;padding-block:0 calc(var(--navh) + 28px)}
header.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:14px 10px;flex-wrap:wrap}
.brand{display:flex;gap:10px;align-items:center;min-width:0}
.mark{width:34px;height:34px;flex:none;border-radius:8px;background:var(--accent);position:relative;overflow:hidden}
.mark::before,.mark::after{content:"";position:absolute;left:0;right:0;height:5px;background:var(--card);opacity:.9}
.mark::before{top:9px}.mark::after{bottom:9px}
.brand b{display:block;font-family:var(--display);font-size:22px;line-height:1;letter-spacing:.01em}
.brand small{display:block;font-size:12.5px;color:var(--ink2);line-height:1.3;margin-top:3px}
.hstats{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--ink2);flex-wrap:wrap}
.pill{font-family:var(--display);font-size:16px;font-weight:700;color:var(--accent-ink);background:var(--accent);padding:1px 9px;border-radius:5px;letter-spacing:.03em}
.pill.dim{background:var(--card2);color:var(--ink2)}
.icon{background:var(--card);border:1px solid var(--line);border-radius:8px;width:38px;height:38px;display:inline-grid;place-items:center;padding:0}
.icon svg,.tabs svg,.btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sync{font-size:12px}
/* navegación */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(7,1fr);background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{background:none;border:0;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--ink2);min-height:var(--navh);justify-content:center}
.tabs button[aria-current="page"]{color:var(--accent);font-weight:600}
.tabs button[aria-current="page"] svg{stroke-width:2.4}
@media (min-width:760px){
  :root{--navh:0px}
  .tabs{position:sticky;top:env(safe-area-inset-top,0px);bottom:auto;border:1px solid var(--line);border-radius:10px;margin-bottom:16px;grid-template-columns:repeat(7,1fr)}
  .tabs button{flex-direction:row;gap:8px;font-size:14px;min-height:46px}
}
/* tipografía y bloques */
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.1;margin:0;text-wrap:balance;letter-spacing:.005em}
h1{font-size:34px}h2{font-size:26px}h3{font-size:20px}
p{margin:0 0 10px}
.lead{color:var(--ink2);font-size:15px}
.small{font-size:13px;color:var(--ink2)}
.eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.card.flat{background:transparent;border-style:dashed}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:9px;padding:11px 16px;font-weight:600;font-size:15px;border:1px solid var(--line);background:var(--card);min-height:46px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.radio{background:var(--radio-bg);border-color:var(--radio);color:var(--radio)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink2);padding-inline:8px}
.btn.wide{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.link{background:none;border:0;padding:0;color:var(--radio);text-decoration:underline;text-underline-offset:3px;font-size:14px}
.chip{display:inline-block;font-size:12.5px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--card2);color:var(--ink2);white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)}.chip.warn{background:var(--warn-bg);color:var(--warn)}.chip.bad{background:var(--bad-bg);color:var(--bad)}.chip.acc{background:var(--accent-bg);color:var(--accent)}
/* nivel A1→C1 como tanque */
.track{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:10px 0 6px}
.track div{position:relative;height:44px;border:1px solid var(--line);border-radius:6px;background:var(--card2);overflow:hidden}
.track span.f{position:absolute;left:0;right:0;bottom:0;background:var(--accent);opacity:.85}
.track div.pass span.f{background:var(--ok);opacity:.9}
.track b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:19px;color:var(--ink);mix-blend-mode:normal}
.track div.cur{outline:2px solid var(--accent);outline-offset:1px}
.big{font-family:var(--display);font-size:46px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpis div{background:var(--card2);border-radius:8px;padding:8px 10px;min-width:0}
.kpis b{display:block;font-family:var(--display);font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpis span{font-size:12px;color:var(--ink2)}
/* turno de hoy */
ol.blocks{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
ol.blocks li button{width:100%;display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
ol.blocks li button:hover{border-color:var(--accent)}
ol.blocks .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:17px;background:var(--card2)}
ol.blocks li.done .n{background:var(--ok);color:var(--card)}
ol.blocks b{display:block;font-size:15.5px}
ol.blocks small{display:block;color:var(--ink2);font-size:13px;line-height:1.35}
/* práctica */
.runhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.prog{height:6px;border-radius:3px;background:var(--card2);overflow:hidden;margin-bottom:14px}
.prog span{display:block;height:100%;background:var(--accent)}
.incoming{background:var(--radio-bg);border:1px solid var(--radio);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.incoming .eyebrow{color:var(--radio)}
.play{display:flex;align-items:center;gap:14px}
.playbtn{width:64px;height:64px;border-radius:50%;border:0;background:var(--radio);color:var(--card);display:grid;place-items:center;flex:none}
.playbtn svg{width:28px;height:28px;fill:currentColor;stroke:none}
.wave{display:flex;gap:4px;align-items:center;height:34px}
.wave i{width:5px;height:10px;border-radius:3px;background:var(--radio);opacity:.5}
.wave.on i{animation:wv .9s ease-in-out infinite;opacity:1}
.wave.on i:nth-child(2){animation-delay:.12s}.wave.on i:nth-child(3){animation-delay:.24s}.wave.on i:nth-child(4){animation-delay:.36s}.wave.on i:nth-child(5){animation-delay:.48s}
@keyframes wv{0%,100%{height:8px}50%{height:32px}}
.cue{font-size:20px;font-weight:600;line-height:1.35}
.cue.en{font-family:var(--body)}
.es{color:var(--ink2);font-size:15px}
.hidden-text{filter:blur(6px);user-select:none}
.tx{border:2px solid var(--accent);border-radius:12px;padding:12px;background:var(--card);display:flex;flex-direction:column;gap:8px}
.tx .eyebrow{color:var(--accent);display:flex;justify-content:space-between;gap:8px;align-items:center}
.tx textarea{width:100%;min-height:88px;resize:vertical;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:10px;font-family:var(--mono);font-size:16px;line-height:1.45}
.tx.tall textarea{min-height:150px}
.hint{font-size:13px;color:var(--ink2);display:flex;gap:6px;align-items:flex-start}
.hint svg{width:16px;height:16px;flex:none;margin-top:2px;fill:none;stroke:currentColor;stroke-width:2}
.fb{border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.fb.ok{background:var(--ok-bg)}.fb.near{background:var(--warn-bg)}.fb.bad{background:var(--bad-bg)}
.fb h3{font-size:22px}
.diff{font-family:var(--mono);font-size:15.5px;line-height:1.9}
.w{padding:1px 4px;border-radius:4px}
.w.ok{background:var(--ok-bg);color:var(--ok)}
.w.near{background:var(--warn-bg);color:var(--warn);text-decoration:underline dotted}
.w.sub{background:var(--bad-bg);color:var(--bad)}.w.sub s{opacity:.7}
.w.miss{background:var(--bad-bg);color:var(--bad);text-decoration:underline}
.w.extra{color:var(--ink2)}
.legendw{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--ink2)}
/* chat */
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;border-radius:12px;padding:10px 12px;font-size:16px}
.msg.them{align-self:flex-start;background:var(--radio-bg);border:1px solid var(--radio)}
.msg.me{align-self:flex-end;background:var(--accent-bg);border:1px solid var(--accent);font-family:var(--mono);font-size:15px}
.msg .meta{display:flex;gap:10px;align-items:center;margin-top:6px;flex-wrap:wrap}
.thinking{display:inline-flex;gap:4px;align-items:center;color:var(--ink2);font-size:14px}
.thinking i{width:6px;height:6px;border-radius:50%;background:currentColor;animation:bl 1.2s infinite}
.thinking i:nth-child(2){animation-delay:.2s}.thinking i:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,100%{opacity:.2}50%{opacity:1}}
/* evaluación */
.scores{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.scores div{background:var(--card2);border-radius:8px;padding:8px 6px;text-align:center;min-width:0}
.scores b{display:block;font-family:var(--display);font-size:24px}
.scores span{font-size:11px;color:var(--ink2);display:block;line-height:1.2}
.fix{border-left:4px solid var(--warn);background:var(--card2);padding:8px 10px;border-radius:0 8px 8px 0;font-size:15px}
.fix s{color:var(--bad)} .fix b{color:var(--ok);font-weight:600}
.phr{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.phr div{min-width:0}
/* ruta */
.lvhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.units{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.units button{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.units button:hover{border-color:var(--accent)}
.units button.cur{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
.units b{font-size:15px;line-height:1.25}
.units small{color:var(--ink2);font-size:12.5px;line-height:1.3}
.meter{height:6px;border-radius:3px;background:var(--card2);overflow:hidden}
.meter span{display:block;height:100%;background:var(--accent)}
.meter span.full{background:var(--ok)}
.plist{display:flex;flex-direction:column;gap:6px}
.pitem{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--card)}
.pitem .en{font-weight:600}
.pitem .es{font-size:13.5px}
.box{font-family:var(--mono);font-size:12px;color:var(--ink2);white-space:nowrap}
/* progreso */
.bars14{display:flex;align-items:flex-end;gap:4px;height:110px;padding-top:6px}
.bars14 div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;height:100%;justify-content:flex-end}
.bars14 span.b{width:100%;max-width:26px;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px}
.bars14 small{font-size:10.5px;color:var(--ink2);font-family:var(--mono)}
.lvbar{display:grid;grid-template-columns:44px minmax(0,1fr) 64px;gap:10px;align-items:center;font-size:14px}
.lvbar b{font-family:var(--display);font-size:18px}
.lvbar output{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.note{font-size:13px;color:var(--ink2)}
.banner{border-radius:10px;padding:10px 12px;font-size:14px;background:var(--warn-bg);color:var(--ink);margin-bottom:12px}
.confirm{border:1px solid var(--bad);background:var(--bad-bg);border-radius:10px;padding:10px 12px}
label.fld{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:600}
label.fld input,label.fld select{font-weight:400;padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);min-height:44px;max-width:100%}
.toggle{display:flex;gap:10px;align-items:flex-start;font-size:14.5px}
.toggle input{width:22px;height:22px;margin-top:1px;accent-color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent)}
.how{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.how div{background:var(--card2);border-radius:8px;padding:8px 10px;font-size:13.5px;min-width:0}
.how b{display:block;font-size:13.5px}
@media (max-width:560px){
  h1{font-size:29px}
  .units,.how{grid-template-columns:1fr}
  .scores{grid-template-columns:repeat(3,minmax(0,1fr))}
  .kpis b{font-size:21px}
  .cue{font-size:18px}
}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ---------- planta, radio y exámenes de unidad ---------- */
.plant{width:100%;height:auto;display:block}
.plant .sb{fill:var(--card);stroke:var(--line);stroke-width:1.5}
.plant .ic *{fill:none;stroke:var(--ink2);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.plant text{fill:var(--ink);font-family:var(--body);font-size:12.5px;font-weight:600}
.plant .pt{font-family:var(--mono);font-size:10px;font-weight:500;fill:var(--ink2);letter-spacing:.08em}
.plant .st[role="button"]{cursor:pointer}
.plant .st[role="button"]:hover .sb{stroke:var(--radio)}
.plant .st:focus{outline:none}.plant .st:focus-visible .sb{stroke:var(--radio);stroke-width:3}
.plant .st.hl .sb{fill:var(--accent-bg);stroke:var(--accent);stroke-width:3}
.plant .st.hl .ic *{stroke:var(--accent)}
.plant .st.dim{opacity:.5}
.plant .pf{fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.plant .pf.ore{stroke:var(--ink2)}.plant .pf.pulp{stroke:var(--radio)}.plant .pf.conc{stroke:var(--accent)}.plant .pf.tail{stroke:var(--line);stroke-width:5}
.plant .pf.water{stroke:var(--radio);stroke-dasharray:3 6;stroke-width:3}.plant .pf.reag{stroke:var(--warn);stroke-dasharray:2 6;stroke-width:3}
.plant .lg text{font-size:10.5px;font-weight:500;fill:var(--ink2)}
.plant .pulse{fill:var(--accent);animation:plp 1.4s ease-in-out infinite}
@keyframes plp{50%{opacity:.2}}
.pgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
.pmap{padding:8px}
.chipbtn{border:0;cursor:pointer;font:inherit;font-size:12.5px;font-weight:600;white-space:normal;text-align:left;line-height:1.35;padding:4px 10px}
.chip.radioc{background:var(--radio-bg);color:var(--radio)}
.rcall{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.rcall:hover{border-color:var(--radio)}
.rcall b{display:block;font-size:15px;line-height:1.25}.rcall small{display:block;color:var(--ink2);font-size:12.5px;line-height:1.3}
.rled{width:10px;height:10px;border-radius:50%;background:var(--line)}.rled.ok{background:var(--ok)}
.pw{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pw div{display:flex;flex-direction:column;border-left:3px solid var(--radio);padding:2px 0 2px 10px;min-width:0}
.pw b{font-family:var(--mono);font-size:14px}.pw span{font-size:13.5px;color:var(--ink2)}
.nato{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px}
.nato button{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 8px;text-align:left;font-size:13.5px;display:flex;gap:6px;align-items:baseline;min-height:40px}
.nato button:hover{border-color:var(--radio)}
.nato b{font-family:var(--display);font-size:18px;color:var(--radio);min-width:14px}
.tagin{font-family:var(--mono);font-size:20px;letter-spacing:.08em;text-transform:uppercase;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);width:12ch;max-width:100%}
.mono{font-family:var(--mono)}
.rhead{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center}
.lcd{background:var(--lcd-bg);color:var(--lcd-fg);font-family:var(--mono);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:140px;border:2px solid var(--lcd-edge);box-shadow:inset 0 0 18px rgba(0,0,0,.35)}
.lcd b{font-size:16px;font-weight:500;line-height:1.2}.lcd span{font-size:11px;letter-spacing:.12em;opacity:.85}
.lcd .rxtx.on{color:var(--lcd-tx);opacity:1}
.lcd .wave{height:22px}.lcd .wave i{background:var(--lcd-fg)}
.rgrid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px;align-items:start}
.rlog{display:flex;flex-direction:column;gap:8px;max-height:46vh;overflow:auto}
.rl{border-radius:10px;padding:8px 10px;max-width:92%;font-size:15px}
.rl.rx{background:var(--radio-bg);border:1px solid var(--radio);align-self:flex-start}
.rl.tx{background:var(--accent-bg);border:1px solid var(--accent);align-self:flex-end}
.rl .eyebrow{display:block;margin-bottom:2px}
.task{border:1px dashed var(--line);border-radius:10px;padding:10px 12px;background:var(--card2);display:flex;flex-direction:column;gap:4px}
ul.ck{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px;font-size:14.5px}
ul.ck li.ok{color:var(--ok)}ul.ck li.no{color:var(--bad)}
.minimap .plant{max-width:260px;margin:0 auto}
.uwhere{display:grid;grid-template-columns:150px minmax(0,1fr);gap:14px;align-items:center}
.usa{aspect-ratio:1;max-width:100%;border-radius:12px;background:var(--radio-bg);color:var(--radio);display:grid;place-items:center;font-family:var(--display);font-size:34px;font-weight:700}
.tfsteps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.tfsteps span{text-align:center;font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;padding:6px 2px;border-radius:7px;background:var(--card2);color:var(--ink2);min-width:0;overflow:hidden;text-overflow:ellipsis}
.tfsteps .cur{background:var(--accent);color:var(--accent-ink)}.tfsteps .done{background:var(--ok-bg);color:var(--ok)}
.tfintro{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tfintro div{border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;min-width:0}
.tfintro b{font-family:var(--display);font-size:19px}.tfintro span{font-size:13.5px;color:var(--ink2)}
fieldset.tq{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;min-width:0}
.tq legend{font-weight:600;margin-bottom:6px;padding:0}
label.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:var(--card);cursor:pointer}
label.opt input{margin-top:3px;accent-color:var(--accent);width:18px;height:18px;flex:none}
label.opt:has(input:checked){border-color:var(--accent);background:var(--accent-bg)}
p.cw{font-size:17px;line-height:2.15;margin:0}
.cwin{font:inherit;font-family:var(--mono);font-size:16px;border:0;border-bottom:2px solid var(--accent);background:var(--accent-bg);padding:0 3px;border-radius:3px 3px 0 0;color:var(--ink);max-width:9em}
.doc{white-space:pre-wrap;background:var(--card2);border-radius:10px;padding:12px 14px;font-size:15px;line-height:1.55;max-height:60vh;overflow:auto;overflow-wrap:anywhere}
.bsline,.bspool{display:flex;flex-wrap:wrap;gap:6px;min-height:46px;align-items:center}
.bsline{border-bottom:2px solid var(--line);padding-bottom:8px}
.tile{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 11px;font-size:16px;min-height:40px}
.tile.on{background:var(--radio-bg);border-color:var(--radio)}
textarea.email{width:100%;min-height:180px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);font-family:var(--body);font-size:16px;line-height:1.5;resize:vertical}
ul.pts{margin:0;padding-left:20px}
.cdown{height:8px;background:var(--card2);border-radius:5px;overflow:hidden}
.cdown span{display:block;height:100%;width:0;background:var(--radio);transition:width .25s linear}.cdown span.over{background:var(--bad)}
.tfbands{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tfbands div{border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;min-width:0}
.tfbands b{font-family:var(--display);font-size:30px;line-height:1.05}.tfbands small{color:var(--ink2);font-size:12.5px}
.rv{border-top:1px dashed var(--line);padding-top:8px}
details.card summary{cursor:pointer;font-size:16px}
.ptt{min-width:160px}
@media (max-width:760px){.pgrid,.rgrid{grid-template-columns:1fr}.rgrid .minimap{order:-1;display:grid;grid-template-columns:112px minmax(0,1fr);gap:12px;align-items:center}.rgrid .minimap .plant{max-width:112px}.rgrid .minimap p{margin:0!important}}
@media (max-width:520px){.rhead{grid-template-columns:1fr}.uwhere{grid-template-columns:96px minmax(0,1fr)}.tfintro,.pw{grid-template-columns:1fr}.tfbands{grid-template-columns:repeat(2,minmax(0,1fr))}.tabs button{font-size:10.5px;padding-inline:0}}

 goal:'Explica qué pasó, por qué y qué propones.',focus:'Because, so, that\'s why · might / could · condicional cero y primero',
 ch:[['Recovery dropped because the grind got coarser.','La recuperación bajó porque la molienda se hizo más gruesa.'],['The cyclone pressure was too low, so the overflow was coarse.','La presión de ciclones estaba muy baja, así que el rebose salió grueso.'],['I think the problem started when the ore changed.','Creo que el problema empezó cuando cambió el mineral.'],['It might be the frother pump.','Podría ser la bomba de espumante.'],['We need to find the root cause.','Tenemos que encontrar la causa raíz.'],['If the pH drops, pyrite floats.','Si baja el pH, flota la pirita.'],['If we close one cyclone, the pressure will go up.','Si cerramos un ciclón, la presión va a subir.'],['That\'s why the grade went down.','Por eso bajó la ley.']],
 tasks:[{es:'Explica a tu superintendente por qué bajó la recuperación y qué propones hacer.',en:'Explain to your superintendent why recovery dropped and what you propose to do.'},{es:'Describe un problema real de tu planta, su causa y la solución.',en:'Describe a real problem in your plant, its cause and the solution.'}]},
{id:'b1u2',lv:'B1',t:'Procedimientos e instrucciones',en:'Walking through a procedure',
 ctx:'Training a new operator on how to take a flotation sample safely.',
 role:'Kevin, a new operator in training',me:'the experienced engineer training him',
 goal:'Explica un procedimiento paso a paso, con seguridad.',focus:'Before / after / once · make sure · voz pasiva básica',
 ch:[['Before you start, check that the area is clear.','Antes de empezar, revisa que el área esté despejada.'],['Make sure the lockout is in place.','Asegúrate de que el bloqueo esté puesto.'],['After that, open the valve slowly.','Después de eso, abre la válvula despacio.'],['The samples are taken every two hours.','Las muestras se toman cada dos horas.'],['The results are sent to the lab.','Los resultados se envían al laboratorio.'],['Don\'t forget to write down the time.','No olvides anotar la hora.'],['Once you finish, clean the sampler.','Cuando termines, limpia el muestreador.'],['Does that make sense?','¿Se entiende?']],
 tasks:[{es:'Explica cómo tomar una muestra de pulpa paso a paso.',en:'Explain step by step how to take a slurry sample.'},{es:'Explica el procedimiento de bloqueo y etiquetado de una bomba.',en:'Explain the lockout and tagout procedure for a pump.'}]},
{id:'b1u3',lv:'B1',t:'Experiencia profesional',en:'Talking about your experience',
 ctx:'A conversation with a visiting consultant about the learner\'s experience in concentrators.',
 role:'Linda, a visiting process consultant from Denver',me:'the plant metallurgist',
 goal:'Habla de lo que has hecho y lo que aún no.',focus:'Presente perfecto · ever / never / already / yet · for / since',
 ch:[['I\'ve worked in concentrators for three years.','He trabajado en concentradoras por tres años.'],['Have you ever operated a SAG mill?','¿Alguna vez has operado un molino SAG?'],['I\'ve never worked with molybdenum.','Nunca he trabajado con molibdeno.'],['We\'ve already changed the screen panels.','Ya cambiamos los paneles de la zaranda.'],['The lab hasn\'t sent the assays yet.','El laboratorio todavía no envía los ensayes.'],['I\'ve been in this area since last year.','Estoy en esta área desde el año pasado.'],['What was the biggest challenge?','¿Cuál fue el mayor desafío?'],['I learned a lot from that project.','Aprendí mucho de ese proyecto.']],
 tasks:[{es:'Cuenta tu experiencia profesional y tu mayor aprendizaje.',en:'Talk about your professional experience and the most important thing you have learned.'},{es:'Cuenta un proyecto en el que participaste.',en:'Describe a project you have worked on.'}]},
{id:'b1u4',lv:'B1',t:'Opiniones y sugerencias',en:'What do you think?',
 ctx:'Two engineers discuss whether to increase the collector dosage after a drop in recovery.',
 role:'Jason, another process engineer',me:'the plant metallurgist',
 goal:'Da tu opinión, acepta o rechaza con cortesía y sugiere.',focus:'In my opinion · I agree / I\'m not sure · should · why don\'t we',
 ch:[['In my opinion, we should reduce the feed.','En mi opinión, deberíamos bajar la alimentación.'],['I agree with you.','Estoy de acuerdo contigo.'],['I\'m not sure that is a good idea.','No estoy seguro de que sea buena idea.'],['What do you think about increasing the collector?','¿Qué opinas de subir el colector?'],['Why don\'t we try a lower dose first?','¿Por qué no probamos primero una dosis menor?'],['That makes sense.','Tiene sentido.'],['The problem is that it costs more.','El problema es que cuesta más.'],['Let\'s see what the data says.','Veamos qué dicen los datos.']],
 tasks:[{es:'Da tu opinión: ¿conviene subir el tonelaje o moler más fino? Justifica.',en:'Give your opinion: should the plant increase throughput or grind finer? Explain why.'},{es:'Rechaza con cortesía una propuesta y sugiere otra.',en:'Politely disagree with a proposal and suggest an alternative.'}]},
{id:'b1u5',lv:'B1',t:'Reunión de turno',en:'The morning meeting',
 ctx:'The daily production meeting. The learner gives the update for the concentrator and answers questions.',
 role:'Rachel, the production manager who leads the meeting',me:'the concentrator shift engineer',
 goal:'Da un reporte breve, entiende preguntas y aclara.',focus:'Let me give you an update · so what you mean is · could you go over',
 ch:[['Let me give you a quick update.','Les doy una actualización rápida.'],['Throughput was on target.','El tonelaje estuvo en meta.'],['We had one unplanned stop.','Tuvimos una parada no programada.'],['The main issue was the lime system.','El problema principal fue el sistema de cal.'],['Could you go over the numbers again?','¿Podrías repasar los números otra vez?'],['So what you mean is that we need more time.','O sea que lo que dices es que necesitamos más tiempo.'],['I\'ll look into it and get back to you.','Lo reviso y te respondo.'],['Any questions?','¿Alguna pregunta?']],
 tasks:[{es:'Da el reporte del turno en la reunión diaria: tonelaje, recuperación, paradas y problema principal.',en:'Give the shift report in the daily meeting: throughput, recovery, stops and the main issue.'},{es:'Pide que te aclaren un dato y confirma lo que entendiste.',en:'Ask someone to clarify a number and confirm what you understood.'}]},
{id:'b1u6',lv:'B1',t:'Entrevista de trabajo',en:'The job interview',
 ctx:'A video interview for a process engineer position at a US mining company.',

{id:'b2u1',lv:'B2',t:'Discusión técnica con datos',en:'Reading the data',
 ctx:'A technical review of a month of plant data: recovery versus grind size, clay content and reagent use.',
 role:'Dr. Patel, the corporate metallurgist',me:'the site metallurgist',
 goal:'Interpreta datos, señala relaciones y límites del análisis.',focus:'The data suggests · compared to · correlation · that said',
 ch:[['The data suggests that recovery is sensitive to grind size above one hundred eighty microns.','Los datos sugieren que la recuperación es sensible al tamaño de molienda sobre ciento ochenta micrones.'],['Compared to last month, reagent consumption is up twelve percent.','Comparado con el mes pasado, el consumo de reactivos subió doce por ciento.'],['There is a strong correlation between clay content and froth stability.','Hay una fuerte correlación entre el contenido de arcillas y la estabilidad de la espuma.'],['That said, the sample size is quite small.','Dicho eso, el tamaño de la muestra es bastante pequeño.'],['We can\'t rule out an instrument error.','No podemos descartar un error de instrumento.'],['The trend is clear, but the cause isn\'t.','La tendencia es clara, pero la causa no.'],['I\'d take these numbers with a grain of salt.','Tomaría estos números con pinzas.'],['Let me break it down for you.','Déjame explicártelo por partes.']],
 tasks:[{es:'Explica qué dicen los datos del mes: recuperación, P80 y reactivos, y qué límites tiene el análisis.',en:'Explain what last month\'s data shows about recovery, grind size and reagents, and the limits of the analysis.'},{es:'Defiende una hipótesis sobre por qué cayó la ley, con evidencia.',en:'Defend a hypothesis about why concentrate grade dropped, using evidence.'}]},
{id:'b2u2',lv:'B2',t:'Negociar con mantenimiento',en:'Negotiating the shutdown',
 ctx:'Maintenance wants a 48-hour stop of the SAG mill; production needs the mill back by Friday.',
 role:'Greg, the maintenance superintendent, under pressure from his own manager',me:'the production engineer',
 goal:'Negocia una solución que funcione para ambos.',focus:'I understand your point, but · would it be possible · what if · I\'m willing to',
 ch:[['I understand your point, but production needs the mill back by Friday.','Entiendo tu punto, pero producción necesita el molino el viernes.'],['Would it be possible to do the inspection during the planned stop?','¿Sería posible hacer la inspección durante la parada programada?'],['What if we split the job into two shifts?','¿Y si dividimos el trabajo en dos turnos?'],['I\'m willing to compromise on the timing.','Estoy dispuesto a ceder en los tiempos.'],['That\'s a deal breaker for us.','Eso para nosotros no es negociable.'],['Let\'s put it in writing.','Pongámoslo por escrito.'],['Where do we go from here?','¿Cómo seguimos desde aquí?'],['I think we can meet halfway.','Creo que podemos llegar a un punto medio.']],
 tasks:[{es:'Negocia con mantenimiento la fecha de la parada del molino.',en:'Negotiate the date of the mill shutdown with the maintenance superintendent.'},{es:'Propón una alternativa cuando te dicen que no.',en:'Propose an alternative after your first request is rejected.'}]},
{id:'b2u3',lv:'B2',t:'Presentar resultados',en:'Presenting a plant trial',
 ctx:'The learner presents the results of a new collector trial to the technical team.',
 role:'Michelle, the technical services manager, who asks sharp questions',me:'the engineer presenting the trial',
 goal:'Presenta un resultado con estructura y responde preguntas.',focus:'Walk you through · as you can see · to sum up · signposting',
 ch:[['Today I\'m going to walk you through the results of the collector trial.','Hoy les voy a presentar los resultados de la prueba de colector.'],['As you can see on this chart, recovery improved by two points.','Como ven en este gráfico, la recuperación mejoró dos puntos.'],['Let me draw your attention to the cost per tonne.','Quiero llamar su atención sobre el costo por tonelada.'],['This brings me to my next point.','Esto me lleva a mi siguiente punto.'],['To sum up, the trial was a success.','En resumen, la prueba fue un éxito.'],['We recommend a full-scale test next month.','Recomendamos una prueba a escala completa el próximo mes.'],['That\'s a great question.','Muy buena pregunta.'],['I\'d be happy to take any questions.','Con gusto respondo preguntas.']],
 tasks:[{es:'Presenta en un minuto los resultados de una prueba en planta.',en:'Present the results of a plant trial in about one minute.'},{es:'Responde una pregunta difícil sobre tu presentación.',en:'Answer a challenging question about your results.'}]},
{id:'b2u4',lv:'B2',t:'Hipótesis y escenarios',en:'What if?',
 ctx:'Planning for scenarios: harder ore next year, lower copper price, a second filter.',
 role:'Steve, the planning engineer',me:'the plant metallurgist',
 goal:'Habla de escenarios reales e hipotéticos y del pasado que pudo ser distinto.',focus:'Segundo y tercer condicional · suppose · assuming · I wish',
 ch:[['If we had a second filter, we wouldn\'t be limited by moisture.','Si tuviéramos un segundo filtro, no estaríamos limitados por la humedad.'],['If we had changed the apexes earlier, we wouldn\'t have lost recovery.','Si hubiéramos cambiado los ápex antes, no habríamos perdido recuperación.'],['Suppose the copper price drops, what would we do?','Supongamos que baja el precio del cobre, ¿qué haríamos?'],['Assuming the ore gets harder, we will need more grinding power.','Asumiendo que el mineral se ponga más duro, vamos a necesitar más potencia de molienda.'],['I wish we had more data.','Ojalá tuviéramos más datos.'],['In the worst case, we would lose two weeks.','En el peor caso, perderíamos dos semanas.'],['It depends on how hard the ore is.','Depende de qué tan duro sea el mineral.'],['Let\'s plan for both scenarios.','Planifiquemos para ambos escenarios.']],
 tasks:[{es:'Explica qué harías si el mineral fuera 30 % más duro el próximo año.',en:'Explain what you would do if the ore were thirty percent harder next year.'},{es:'Cuenta un error del pasado y qué habría pasado si se hubiera actuado distinto.',en:'Describe a past mistake and what would have happened if the team had acted differently.'}]},
{id:'b2u5',lv:'B2',t:'Reportar un incidente',en:'Incident investigation',
 ctx:'Investigation interview after a near miss: a pump guard was removed and the pump was not isolated.',
 role:'Angela, the HSE investigator',me:'the area engineer',
 goal:'Reporta hechos con precisión, lo que otros dijeron y las acciones correctivas.',focus:'Estilo indirecto · voz pasiva · should have',
 ch:[['The operator said that he had isolated the pump.','El operador dijo que había aislado la bomba.'],['It was reported that the guard had been removed.','Se reportó que se había retirado la guarda.'],['The area should have been barricaded.','El área debió estar barricada.'],['Nobody was injured, but it was a close call.','Nadie se lesionó, pero estuvo cerca.'],['Corrective actions have been assigned to each area.','Se asignaron acciones correctivas a cada área.'],['We need to make sure this doesn\'t happen again.','Tenemos que asegurarnos de que no vuelva a pasar.'],['According to the log, the pump was restarted at noon.','Según el registro, la bomba se reinició al mediodía.'],['I can\'t confirm that yet.','Todavía no puedo confirmarlo.']],
 tasks:[{es:'Reporta un casi accidente: hechos, lo que dijeron los involucrados y acciones correctivas.',en:'Report a near miss: the facts, what the people involved said and the corrective actions.'},{es:'Explica qué se debió hacer distinto.',en:'Explain what should have been done differently.'}]},
{id:'b2u6',lv:'B2',t:'Small talk y cultura laboral',en:'Small talk at work',
 ctx:'Small talk with American coworkers at lunch on a Monday: weekend, sports, weather, family.',
 role:'Jake, an American coworker who loves football and hiking',me:'a Peruvian engineer who just moved to Arizona',
 goal:'Conversa con naturalidad y mantén la charla.',focus:'Preguntas de seguimiento · respuestas con detalle · expresiones americanas',
 ch:[['How was your weekend?','¿Qué tal tu fin de semana?'],['Not bad, I went hiking with my family.','Nada mal, fui de caminata con mi familia.'],['Are you into football?','¿Te gusta el fútbol americano?'],['I\'m still getting used to the heat here.','Todavía me estoy acostumbrando al calor de aquí.'],['Let\'s grab lunch sometime.','Almorcemos juntos un día de estos.'],['That sounds great.','Suena genial.'],['No worries, it happens.','No te preocupes, pasa.'],['What do you guys usually do on weekends?','¿Qué suelen hacer ustedes los fines de semana?']],
 tasks:[{es:'Cuenta tu fin de semana con detalles y pregunta por el de tu compañero.',en:'Tell a coworker about your weekend with some details and ask about theirs.'},{es:'Habla de las diferencias entre trabajar en Perú y en Estados Unidos.',en:'Talk about the differences between working in Peru and in the United States.'}]},
/* ---------------- C1 ---------------- */
{id:'c1u1',lv:'C1',t:'Matizar y ser preciso',en:'Hedging and precision',
 ctx:'A technical review where the learner must state conclusions carefully, without overclaiming.',
 role:'Dr. Hughes, a skeptical senior consultant',me:'the lead metallurgist',
 goal:'Expresa grados de certeza y distingue causa de correlación.',focus:'Hedging · it\'s fair to say · to a large extent · strictly speaking',
 ch:[['It\'s fair to say that the new liners have had a positive impact.','Es justo decir que los nuevos forros han tenido un impacto positivo.'],['There is some evidence to suggest that clay is the main driver.','Hay cierta evidencia que sugiere que la arcilla es el factor principal.'],['I\'d be inclined to wait for another week of data.','Me inclinaría por esperar otra semana de datos.'],['To a large extent, the issue is operational rather than metallurgical.','En gran medida, el problema es operativo más que metalúrgico.'],['Strictly speaking, that isn\'t a root cause.','En sentido estricto, eso no es una causa raíz.'],['I wouldn\'t go so far as to say it failed.','No llegaría a decir que fracasó.'],['The jury is still out on that.','Eso todavía no está claro.'],['What we can say with confidence is that grind size matters.','Lo que sí podemos decir con seguridad es que el tamaño de molienda importa.']],
 tasks:[{es:'Presenta una conclusión técnica con el nivel de certeza correcto y responde a un escéptico.',en:'State a technical conclusion with the right degree of certainty and respond to a skeptic.'},{es:'Explica la diferencia entre correlación y causa con un ejemplo de tu planta.',en:'Explain the difference between correlation and causation using an example from your plant.'}]},
{id:'c1u2',lv:'C1',t:'Liderar una reunión',en:'Running the meeting',
 ctx:'The learner chairs a cross-functional meeting with maintenance, mine planning and the lab, with competing priorities.',
 role:'several participants who interrupt, digress and disagree (play them all, naming who speaks)',me:'the meeting chair',
 goal:'Dirige: da la palabra, corta digresiones, resume y asigna acciones.',focus:'Turn-taking · let\'s not get sidetracked · circle back · action items',
 ch:[['Let\'s get started, we have a lot to cover.','Empecemos, tenemos mucho que ver.'],['I\'d like to hear from maintenance first.','Quisiera escuchar primero a mantenimiento.'],['Let\'s not get sidetracked; we can take that offline.','No nos desviemos; eso lo vemos aparte.'],['Can we circle back to the budget question?','¿Podemos volver al tema del presupuesto?'],['Just to make sure we\'re on the same page.','Solo para asegurarnos de que estamos de acuerdo.'],['Who is going to own this?','¿Quién se va a hacer cargo de esto?'],['Let\'s wrap up with the action items.','Cerremos con los compromisos.'],['I appreciate everyone\'s input.','Agradezco los aportes de todos.']],
 tasks:[{es:'Abre la reunión, presenta la agenda y da la palabra.',en:'Open a meeting, present the agenda and hand over to the first speaker.'},{es:'Cierra la reunión: resume los acuerdos y asigna responsables y fechas.',en:'Close a meeting: summarize the decisions and assign owners and deadlines.'}]},
{id:'c1u3',lv:'C1',t:'Caso de negocio para gerencia',en:'Pitching to senior management',
 ctx:'Asking the general manager for approval of a 4-million-dollar flotation upgrade.',
 role:'Robert, the general manager, who cares about payback, risk and safety',me:'the metallurgical engineer leading the project',
 goal:'Convence con números, riesgos y una petición clara.',focus:'The bottom line · payback · mitigate · I\'d argue that',
 ch:[['The bottom line is that this project pays back in under eighteen months.','En resumen, este proyecto se paga en menos de dieciocho meses.'],['The key risk is ore variability, which we can mitigate with blending.','El riesgo clave es la variabilidad del mineral, que podemos mitigar con mezclas.'],['We\'re asking for approval to move forward with phase one.','Pedimos aprobación para avanzar con la fase uno.'],['I\'d argue that doing nothing is the riskier option.','Yo diría que no hacer nada es la opción más riesgosa.'],['Let me put that into perspective.','Déjeme ponerlo en perspectiva.'],['Two points of recovery are worth about nine million dollars a year.','Dos puntos de recuperación valen unos nueve millones de dólares al año.'],['We\'ve stress-tested the numbers.','Hemos sometido los números a pruebas de estrés.'],['If it doesn\'t deliver, we can scale it back.','Si no da resultados, podemos reducirlo.']],
 tasks:[{es:'Presenta en dos minutos un proyecto de mejora a gerencia con beneficio, costo, riesgo y petición.',en:'Pitch an improvement project to senior management in about two minutes: benefit, cost, risk and your request.'},{es:'Responde a la objeción: "We don\'t have the budget this year".',en:'Respond to the objection: We don\'t have the budget this year.'}]},
{id:'c1u4',lv:'C1',t:'Desacuerdo y preguntas difíciles',en:'Handling pushback',
 ctx:'A tense review in which the learner\'s analysis is challenged by a senior manager in front of the team.',
 role:'Diane, the VP of operations, direct and impatient',me:'the engineer whose analysis is challenged',
 goal:'Sostén tu posición con respeto, reconoce lo válido y no te comprometas a lo que no puedes.',focus:'I take your point · with all due respect · let me address that · I\'m not in a position to',
 ch:[['I take your point, but I see it differently.','Entiendo su punto, pero lo veo distinto.'],['With all due respect, the numbers don\'t support that conclusion.','Con todo respeto, los números no respaldan esa conclusión.'],['That\'s a fair question; let me address it directly.','Es una pregunta justa; déjeme responderla directamente.'],['I\'m not in a position to commit to that today.','No estoy en condiciones de comprometerme a eso hoy.'],['Let me get back to you on that.','Le respondo eso más tarde.'],['You have a point there.','En eso tiene razón.'],['Where I\'d push back is on the timeline.','Donde no estoy de acuerdo es en el plazo.'],['Can we agree on what we would need to see to change our minds?','¿Podemos acordar qué tendríamos que ver para cambiar de opinión?']],
 tasks:[{es:'Defiende tu análisis frente a una crítica fuerte, con respeto y datos.',en:'Defend your analysis against strong criticism, respectfully and with data.'},{es:'Responde una pregunta para la que no tienes la respuesta completa.',en:'Respond to a question you cannot fully answer yet.'}]},
{id:'c1u5',lv:'C1',t:'Idioms y lo que no se dice',en:'Reading between the lines',
 ctx:'An informal debrief after a difficult week, full of idioms, irony and things implied rather than said.',
 role:'Mark, a sarcastic but kind American senior engineer',me:'his colleague',
 goal:'Entiende y usa idioms y lenguaje implícito.',focus:'Idioms frecuentes · ironía · understatement',
 ch:[['We\'re back to square one.','Volvimos a fojas cero.'],['Let\'s play it by ear.','Vamos viendo sobre la marcha.'],['That was a close call.','Estuvo cerca.'],['We need to get everyone on board.','Tenemos que lograr que todos se sumen.'],['It\'s not rocket science, but it takes discipline.','No es nada del otro mundo, pero requiere disciplina.'],['The ball is in their court.','La pelota está en su cancha.'],['Well, that went great, didn\'t it?','Bueno, eso salió genial, ¿no? (con ironía)'],['I\'ll believe it when I see it.','Lo creeré cuando lo vea.']],
 tasks:[{es:'Cuenta una semana difícil usando al menos tres idioms.',en:'Talk about a difficult week at work using at least three idioms naturally.'},{es:'Explica qué quiso decir realmente alguien que habló con ironía.',en:'Explain what someone really meant when they said something ironic.'}]},
{id:'c1u6',lv:'C1',t:'Entrevista avanzada (STAR)',en:'The behavioral interview',
 ctx:'A final-round behavioral interview for a senior metallurgist position in Arizona.',
 role:'Christine, the hiring manager, who asks probing follow-up questions',me:'the candidate',
 goal:'Responde con el método STAR y sostén las repreguntas.',focus:'Situation, task, action, result · looking back · lessons learned',
 ch:[['Tell me about a time you solved a difficult problem.','Cuénteme de una vez en que resolvió un problema difícil.'],['The situation was a sudden drop in recovery.','La situación fue una caída repentina de la recuperación.'],['My task was to find the root cause within one shift.','Mi tarea era encontrar la causa raíz en un turno.'],['I organized a sampling campaign and ran the numbers.','Organicé una campaña de muestreo y analicé los números.'],['As a result, we recovered three points within a week.','Como resultado, recuperamos tres puntos en una semana.'],['Looking back, I\'d have involved maintenance earlier.','En retrospectiva, habría involucrado antes a mantenimiento.'],['What I took away from it was the value of good data.','Lo que me llevé de eso fue el valor de tener buenos datos.'],['I thrive in environments where I can take ownership.','Me desempeño mejor donde puedo hacerme cargo.']],
 tasks:[{es:'Responde con STAR: "Tell me about a time you disagreed with your boss".',en:'Answer using the STAR method: Tell me about a time you disagreed with your manager.'},{es:'Responde con STAR: "Tell me about a failure and what you learned".',en:'Answer using the STAR method: Tell me about a failure and what you learned from it.'}]}
];

a2u4:{cw:"First, the trucks bring the ore from the mine to the crusher. Then the mills grind the rock into a fine powder. After that, flotation separates the copper minerals from the waste. Finally, we filter the concentrate and ship it to the smelter.",
 rd:{k:"Read in Daily Life",src:"Guide for new employees",text:"HOW OUR CONCENTRATOR WORKS\nThe mine sends about 60,000 tonnes of ore to the plant every day. The ore has only 0.5% copper, so we need to concentrate it. The crusher and the mills make the rock smaller, like sand. In flotation, we add chemicals and air. The copper minerals stick to the air bubbles and float, and the waste sinks. The concentrate has about 26% copper. It is more than fifty times richer than the ore.",
  q:[["Why does the plant need to concentrate the ore?",["The ore has very little copper.","The ore is too big.","The smelter is far.","The waste is valuable."]],["What floats in flotation?",["The copper minerals","The waste","The water","The chemicals"]],["How rich is the concentrate compared to the ore?",["More than fifty times richer","Two times richer","The same","Five times richer"]]]},
 lcr:[["What does the crusher do?",["It breaks big rocks into smaller pieces.","It floats the copper.","It's next to the mill.","Yes, it does."]],["Is the concentrate richer than the ore?",["Yes, much richer.","Yes, it's heavier.","No, it's in the filter.","It's twenty-six."]],["What happens after grinding?",["The slurry goes to flotation.","It happened yesterday.","Grinding is loud.","After lunch."]],["Why do you add air in flotation?",["To make bubbles that carry the copper.","Because it's hot.","Air is free.","To clean the cells."]]],
 ls:{k:"Listen to a Conversation",lines:[["A","So, how does a concentrator make money?"],["B","Well, the ore has very little copper, less than one percent."],["A","That's not much."],["B","Right. So first we crush and grind the ore. Then flotation separates the copper minerals from the rock."],["A","And what do you sell?"],["B","We sell the concentrate. It's about twenty-six percent copper. The smelter pays us for the copper in it."],["A","So more recovery means more money?"],["B","Exactly."]],
  q:[["How much copper is in the ore?",["Less than one percent","About twenty-six percent","About ten percent","Fifty percent"]],["What does the plant sell?",["Concentrate","Ore","Pure copper","Waste rock"]],["What does the woman understand at the end?",["More recovery means more money.","Grinding is expensive.","The smelter is far.","The ore is rich."]]]},

 iv:["Can you explain how a concentrator works?","Which part of the process is the most difficult? Why?","How is your plant different from other plants?"]},

b1u1:{cw:"Copper recovery dropped three points this morning, and the superintendent wants an explanation. The data shows that the grind became coarser after we increased the throughput. Coarse particles are harder to float, so we lost copper to the tailings.",
 rd:{k:"Read in Daily Life",src:"Email",text:"From: Brian Cole\nSubject: Recovery this morning\n\nLuis,\nRecovery was 83% between 6 and 10 a.m., three points below target. Could you look into it and send me your explanation by noon? Please check the grind size, the reagent dosage and the ore source. If it was the new ore from the north pit, I need to know so I can talk to mine planning. Also let me know if we should reduce throughput until it's fixed.\nThanks,\nBrian",
  q:[["What does Brian want by noon?",["An explanation of the recovery drop","A new ore source","The reagent invoices","A meeting with mine planning"]],["Why does Brian mention the north pit?",["The new ore might be the cause.","It has better ore.","It is closed.","It is near the plant."]],["What decision might Brian make?",["Reduce throughput","Close the plant","Change the reagent supplier","Hire more operators"]]]},
 lcr:[["Why did recovery drop this morning?",["It's likely because the grind was coarser.","It dropped three points.","Yes, it did.","I'll drop it later."]],["Could the ore be the problem?",["It might be. The new ore has more clay.","Yes, I could.","The ore is in the stockpile.","No, it's my problem."]],["What happens if we reduce the throughput?",["The grind will get finer, so recovery should improve.","It happened yesterday.","We reduced it.","Throughput is high."]],["So that's why the tails were high?",["Exactly. Coarse particles went to the tails.","Yes, the tails are high.","Why not?","It's my fault, sorry."]]],
 ls:{k:"Listen to a Conversation",lines:[["A","Brian, I looked at the data from this morning."],["B","Great. What did you find?"],["A","Recovery dropped because the grind got coarser. The P80 went from one fifty to about one ninety microns."],["B","Why did that happen?"],["A","We increased the feed to the SAG mill at six a.m., so the ball mills had less time to grind."],["B","So it wasn't the ore?"],["A","The ore was a bit harder too, but the main cause was the higher feed."],["B","OK. What do you suggest?"],["A","Let's reduce the feed by five percent until the P80 is back below one sixty."]],
  q:[["What was the main cause of the drop?",["The higher feed to the SAG mill","Harder ore","Low reagent dosage","A broken pump"]],["What happened to the P80?",["It increased to about 190 microns","It dropped to 150 microns","It stayed the same","It went below 160 microns"]],["What does she suggest?",["Reducing the feed by five percent","Changing the ore","Adding more collector","Stopping the mill"]]]},
 em:{to:"Brian, the concentrator superintendent",sit:"Brian asked why recovery dropped this morning.",pts:["Explain the main cause with one number","Mention one other possible factor","Suggest an action and what you expect to happen"]},
 iv:["Tell me about a time a process problem affected production. What was the cause?","How do you decide whether a problem comes from the ore or from the operation?","What would you do first if recovery dropped by five points?"]},

b1u2:{cw:"Before you take a flotation sample, make sure you are wearing gloves and safety glasses. Once you are at the cell, check the sample cutter and clean the bucket. The sample must be labeled with the time, the cell and your name before it is sent to the lab.",
 rd:{k:"Read in Daily Life",src:"Procedure",text:"PROCEDURE PR-FL-07: TAKING A ROUGHER TAILS SAMPLE\n1. Wear the required PPE: hard hat, glasses, gloves and boots.\n2. Inform the control room before you go to the sampling point.\n3. Check that the platform is clean and the handrail is in place.\n4. Make three cuts with the sample cutter, one minute apart.\n5. Label the bucket: date, time, sampling point, your initials.\n6. Take the sample to the lab within 30 minutes.\nDo NOT put your hand in the launder. If the cutter is blocked, call maintenance.",
  q:[["What should you do before going to the sampling point?",["Inform the control room","Clean the launder","Call maintenance","Label the bucket"]],["How many cuts do you make?",["Three, one minute apart","One","Thirty","Two, three minutes apart"]],["What should you do if the cutter is blocked?",["Call maintenance","Put your hand in the launder","Take the sample later","Make more cuts"]]]},
 lcr:[["What should I do before I go to the cell?",["Make sure you tell the control room.","I did it before.","The cell is over there.","You should go."]],["How long do I have to take the sample to the lab?",["You have thirty minutes.","It's a long time.","Take it with you.","Three cuts."]],["What if the cutter is blocked?",["Don't touch it. Call maintenance.","It's blocked.","If you want.","Yes, it is."]],["Is the sample labeled?",["Yes, with the time, the point and my initials.","Yes, it's a sample.","Label it now.","It is sent to the lab."]]],
 ls:{k:"Listen to a Conversation",lines:[["A","OK Kevin, before we start, what PPE do you need?"],["B","Hard hat, glasses, gloves and boots."],["A","Good. Once we get to the platform, what's the first thing you check?"],["B","That it's clean and the handrail is in place?"],["A","Exactly. Now, the sample is taken in three cuts. Why do you think we do three cuts and not one?"],["B","To get a sample that represents the whole period?"],["A","That's right. A single cut can give you a wrong number. And remember: never put your hand in the launder."]],
  q:[["What is the first thing Kevin checks on the platform?",["That it is clean and the handrail is in place","The pH","The bucket label","The cutter speed"]],["Why do they take three cuts?",["To get a more representative sample","To save time","Because the lab asks for three buckets","Because the cutter is slow"]],["What does the trainer say to never do?",["Put your hand in the launder","Wear gloves","Take three cuts","Talk to the control room"]]]},

 iv:["Explain a procedure you know well, step by step.","Why is it important to follow procedures exactly?","Have you ever seen someone skip a step in a procedure? What happened?"]},

 rd:{k:"Read in Daily Life",src:"Professional profile",text:"LUIS TORRES – PROCESS ENGINEER\nExperience\n• Process Engineer, copper concentrator, Peru (2023 – present): optimized flotation reagents; reduced collector use by 12% without losing recovery.\n• Metallurgical trainee, polymetallic plant, Peru (2021 – 2023): grinding and classification; daily metallurgical balance.\nEducation: B.Sc. Metallurgical Engineering\nLanguages: Spanish (native), English (B1)\nSkills: flotation, process control, Excel, Power BI",

b1u5:{cw:"Good morning, everyone. Let me give you a quick update on the concentrator. We processed sixty-two thousand tonnes yesterday, which is two percent above the plan. Recovery was eighty-five percent, but we had a short stop on ball mill two that we are still investigating.",
 rd:{k:"Read in Daily Life",src:"Daily report",text:"DAILY PRODUCTION REPORT – CONCENTRATOR – MAY 14\nThroughput: 62,300 t (plan 61,000 t)\nCopper recovery: 85.1% (plan 86.0%)\nConcentrate grade: 26.4% Cu\nAvailability: 96.5%\nEvents: Ball mill 2 stopped 50 minutes (high motor temperature; cause under investigation).\nSafety: 0 incidents; 1 near miss reported (slippery floor, flotation).\nActions: Inspect BM2 cooling system today (Maintenance). Clean flotation floor (Operations).",
  q:[["Which value was below plan?",["Recovery","Throughput","Availability","Concentrate grade"]],["What was reported about safety?",["A near miss on a slippery floor","An accident at the mill","Nothing","A fire"]],["Who will inspect the cooling system?",["Maintenance","Operations","Safety","The lab"]]]},
 lcr:[["Could you go over the recovery numbers again?",["Sure. Recovery was eighty-five point one, below the plan of eighty-six.","Yes, it was over.","I could go.","Recovery is good, thanks."]],["So what you mean is that the mill stop was the main issue?",["Not exactly. The stop was short; the ore was the bigger factor.","Yes, I mean.","The mill is big.","What I mean is a stop."]],["Any safety issues yesterday?",["One near miss: a slippery floor in flotation. It's been cleaned.","Yes, safety is important.","No issues, yes.","Safety first."]],["When will we know the cause of the mill stop?",["Maintenance is inspecting it today, so by this afternoon.","It stopped yesterday.","The cause is a mill.","We will know it."]]],

  q:[["What was the main reason for the lower recovery?",["Ore from the north pit with more pyrite","The ball mill stop","Low throughput","A reagent problem"]],["How long was the ball mill stopped?",["Fifty minutes","Fifteen minutes","Five hours","Fifty hours"]],["What does 'keep me posted' mean?",["Give me updates","Send me a letter","Stay in your position","Write a report now"]]]},

 rd:{k:"Read in Daily Life",src:"Job ad",text:"PROCESS ENGINEER – COPPER CONCENTRATOR (ARIZONA)\nWe are looking for a process engineer to join our metallurgy team.\nResponsibilities: monitor plant performance, run plant trials, support operators, write weekly reports.\nRequirements: B.Sc. in Metallurgical or Chemical Engineering; 3+ years in mineral processing; experience with flotation; good communication skills in English.\nNice to have: experience with SAG mills, Power BI, and advanced process control.\nWe offer: relocation support, health insurance, 3 weeks of vacation.\nApply by June 30.",

 lcr:[["Tell me a little about yourself.",["I'm a process engineer with four years of experience in copper flotation.","I'm fine, thank you for asking.","Yes, a little.","My self is good."]],["Why do you want to work for us?",["Because your plant uses technology I want to learn, like large SAG circuits.","Because I want.","I work for you.","Yes, I want it."]],["What's your greatest strength?",["I'm good at turning plant data into clear decisions.","My strength is big.","I'm strong, yes.","Strength is important."]],["Do you have any questions for us?",["Yes. What would my first three months look like?","No, I have no questions, I'm good.","Yes, I have.","Questions are good."]]],
 ls:{k:"Listen to a Conversation",lines:[["A","Thanks for joining us, Luis. Can you tell me about your current role?"],["B","Sure. I'm a process engineer at a copper concentrator in Peru. My main responsibility is flotation performance."],["A","What's an achievement you're proud of?"],["B","Last year I led a reagent trial that cut collector use by twelve percent with no loss in recovery."],["A","Great. Why are you interested in moving to Arizona?"],["B","I'd like to work with larger SAG circuits and improve my English in a real work environment."],["A","Makes sense. Our next step is a technical interview with the metallurgy manager."]],

b2u1:{cw:"Looking at last month's data, recovery appears to depend more on grind size than on reagent dosage. Compared to the first two weeks, the P80 increased by twenty microns and recovery fell by about two points. That said, the clay content also changed, so we cannot attribute the whole drop to grinding.",
 rd:{k:"Read an Academic Passage",src:"Technical note",text:"INTERPRETING PLANT DATA: CORRELATION IS NOT CAUSATION\nPlant engineers often look for a single variable that explains a change in recovery. Monthly data, however, rarely isolate one effect. When throughput rises, the grind usually becomes coarser, but the mine may also be sending a different ore. If recovery falls during the same period, a simple chart of recovery versus P80 will show a strong correlation even if the real cause is the ore. For this reason, many metallurgists combine plant data with controlled tests: they keep the ore constant in the lab and change one variable at a time. Plant trials can also help, provided they alternate conditions on and off over several days, so that ore changes affect both conditions equally.",
  q:[["What is the main point of the passage?",["A correlation in plant data does not prove what caused a change.","Throughput always reduces recovery.","Lab tests are better than plant trials.","P80 is the most important variable."]],["Why might recovery and P80 appear strongly related even if P80 is not the cause?",["Because the ore may change at the same time as the grind.","Because the lab tests are wrong.","Because throughput is always constant.","Because recovery cannot be measured."]],["According to the passage, what makes a plant trial more reliable?",["Alternating conditions on and off over several days","Running it for one shift only","Changing several variables at once","Ignoring ore changes"]]]},
 lcr:[["Does the data show that the collector made a difference?",["Not clearly. The effect is within the normal variation.","Yes, the data is data.","The collector is expensive.","It shows the data."]],["Compared to last month, how's the grind?",["About twenty microns coarser, mainly because of higher throughput.","It's grinding.","Last month was better, yes.","Compared it."]],["Couldn't the clay explain part of the drop?",["It could. That said, the grind effect looks larger.","Yes, the clay is in the ore.","No, I couldn't.","Clay is a mineral."]],["So what's your recommendation?",["Run an on-off trial for two weeks before changing the reagent scheme.","My recommendation is good.","I recommend.","To recommend, yes."]]],
 ls:{k:"Listen to a Conversation",lines:[["A","I've looked at your monthly report. You're saying the drop in recovery is mostly due to the grind?"],["B","That's what the data suggests. When the P80 went above one eighty, recovery fell by about two points."],["A","But the clay content also went up in the same weeks."],["B","True, and that's a fair point. That's why I separated the days with high clay. Even on low-clay days, the coarse grind cost about one and a half points."],["A","That's more convincing. How confident are you in the clay measurement, though?"],["B","Honestly, not very. It's a visual estimate from the lab. I'd like to start using X-ray diffraction on a weekly composite."],["A","Good. Put that in your recommendations."]],
  q:[["How did Luis address the clay issue in his analysis?",["He looked separately at the days with low clay.","He ignored it.","He removed the clay from the ore.","He asked the mine to stop sending clay."]],["What weakness does the woman identify?",["The clay measurement is not reliable.","The P80 data is missing.","Recovery was not measured.","The report is too long."]],["What does Luis propose to improve the data?",["Using X-ray diffraction on a weekly composite","Measuring P80 every hour","Hiring a new lab technician","Changing the collector"]]]},
 em:{to:"Dr. Patel, the corporate metallurgist",sit:"After your data review, send a short summary of your findings.",pts:["State your main conclusion with the key numbers","Acknowledge the limitation of the data","Propose next steps to confirm the conclusion"]},
 iv:["How do you decide whether a plant trial was successful?","Tell me about a time data led you to a wrong conclusion. What did you learn?","Which data do you think is most underused in concentrators?"]},

b2u2:{cw:"Maintenance wants to stop the SAG mill for forty-eight hours this week, but production needs the mill back by Friday to meet the monthly target. I understand their concern about the liners. Would it be possible to split the job into two shorter stops, or to start on Thursday night instead?",
 rd:{k:"Read in Daily Life",src:"Email",text:"From: Greg Walsh (Maintenance Superintendent)\nSubject: SAG mill stop – this week\n\nLuis,\nThe liner inspection on Monday showed that the feed-end liners are below the minimum thickness in two places. If we wait until the planned shutdown next month, we risk a shell crack, which would mean at least two weeks without the mill. I'm proposing a 48-hour stop starting Wednesday at 6 a.m. I know this hurts the monthly target, but I'm not willing to take that risk. If you have an alternative that addresses the liner issue, I'm open to hearing it before 3 p.m. today.\nGreg",
  q:[["Why does Greg want to stop the mill now?",["The liners are too thin and could cause a shell crack.","The planned shutdown was canceled.","The production target is low.","The contractor is available only this week."]],["What is Greg's attitude toward alternatives?",["He is open to them if they address the liner issue.","He refuses to discuss them.","He prefers to wait until next month.","He leaves the decision to Luis."]],["What would a shell crack mean?",["At least two weeks without the mill","A 48-hour stop","A small drop in recovery","A new liner design"]]]},
 lcr:[["We need the mill down for forty-eight hours, starting Wednesday.",["I understand. Would it be possible to start Thursday night instead?","Yes, it's Wednesday.","Forty-eight is a lot of hours.","Down is down."]],["What if we only change the worst liners now?",["That could work if it keeps the stop under twenty-four hours.","If we change them.","The worst liners are bad.","What if, yes."]],["I'm not willing to take that risk.",["I hear you. Let's look at options that keep the risk low but protect the target.","OK, I'm not willing either.","Risk is dangerous.","Why not?"]],["Can you guarantee the mill will be back by Friday?",["I can't guarantee it, but with two crews we have a good chance.","Yes, I can guarantee.","Friday is guaranteed.","The mill is back."]]],
 ls:{k:"Listen to a Conversation",lines:[["A","Luis, I need the SAG mill down for forty-eight hours starting Wednesday."],["B","I understand the liner risk. But a two-day stop this week puts the monthly target out of reach."],["A","And a cracked shell puts the whole quarter out of reach."],["B","Fair point. What if we change only the feed-end liners now? Your inspection showed those are the critical ones."],["A","That's about twenty hours of work with one crew."],["B","Could we bring in a second crew to bring it down to fourteen?"],["A","Possibly, if you cover the contractor cost from your budget."],["B","I'm willing to do that. And we keep the full reline next month, as planned."],["A","OK. I can live with that."]],
  q:[["What is Luis's proposal?",["Change only the critical feed-end liners now","Skip the liner change","Stop the mill for two days","Postpone everything to next month"]],["What condition does the maintenance superintendent set?",["Production pays for the extra contractor crew","The stop must start on Friday","Luis must work the night shift","The full reline is canceled"]],["What does 'I can live with that' mean?",["I accept it, although it is not perfect","I will move to the plant","I am very happy with it","I don't agree"]]]},
