b2u3:{cw:"Today I would like to walk you through the results of the new collector trial. As you can see on this chart, recovery increased by one point two percent during the trial days. To sum up, the new collector pays for itself, but we need two more weeks of data to be sure.",
 rd:{k:"Read in Daily Life",src:"Trial summary",text:"PLANT TRIAL SUMMARY – COLLECTOR X-45\nObjective: test whether X-45 improves copper recovery compared with the current collector.\nDesign: 20 days, alternating 2 days with X-45 and 2 days with the current collector.\nResults: Recovery was 1.2 points higher on X-45 days (86.4% vs 85.2%). The difference was larger with a coarse grind (P80 above 170 µm). Concentrate grade was unchanged.\nCost: X-45 costs US$0.06/t more. The extra copper is worth about US$0.90/t at current prices.\nLimitations: only one ore type was processed during the trial.\nRecommendation: extend the trial for 2 weeks with ore from the north pit before full adoption.",
  q:[["Why did the trial alternate the collectors every two days?",["To reduce the effect of ore changes on the comparison","Because X-45 was in short supply","To save money","Because the lab asked for it"]],["When was the benefit of X-45 larger?",["With a coarse grind","With a fine grind","When the grade was higher","On weekends"]],["Why does the author recommend extending the trial?",["Only one ore type was tested.","The results were negative.","X-45 is too expensive.","Concentrate grade dropped."]]]},
 lcr:[["Could you go back to the previous slide?",["Sure. This is recovery by day.","I could go back.","The slide is previous.","Yes, it was."]],["How do you know the improvement isn't just the ore?",["We alternated the collectors every two days, so both saw the same ores.","Because I know.","The ore is good.","It's an improvement."]],["What's the payback?",["The extra copper is worth about fifteen times the extra reagent cost.","Payback is money.","It pays.","Back in two weeks."]],["Any questions before I move on?",["Yes. How significant is the difference statistically?","No, move.","Yes, I have questions before.","Moving on, thanks."]]],
 ls:{k:"Listen to an Academic Talk",lines:[["B","Good afternoon. I'd like to walk you through the results of the X-45 trial: first the design, then the results, and finally my recommendation."],["B","We ran the trial for twenty days, alternating collectors every two days so that both would see similar ore."],["B","As you can see on this chart, recovery was one point two higher with X-45."],["A","Sorry to interrupt. Is that difference statistically significant?"],["B","Good question. With twenty days, it's significant at the ninety percent level, but not at ninety-five. That's one reason I'm recommending an extension."],["A","OK, go on."],["B","To sum up, X-45 seems to pay for itself many times over, but we need two more weeks, including ore from the north pit, before we switch."]],
  q:[["How is the presentation organized?",["Design, results, recommendation","Results, cost, questions","Problem, solution, budget","History, design, results"]],["Why does the woman interrupt?",["To ask whether the difference is statistically significant","To ask about the cost","To correct a number","To end the meeting"]],["What is one reason the speaker recommends extending the trial?",["The result is not significant at the 95 percent level","The collector is too expensive","Recovery decreased","The plant will close"]]]},
 em:{to:"Michelle, the technical services manager",sit:"After your presentation, Michelle asked for a written summary for the general manager.",pts:["Summarize the trial design in one sentence","Give the key result and the economics","State the limitation and your recommendation"]},
 iv:["Describe a presentation you gave. How did you prepare?","How do you handle a question you can't answer during a presentation?","What makes a technical presentation effective for managers?"]},

b2u4:{cw:"Suppose the ore becomes ten percent harder next year. If that happened, the SAG mill would process less tonnage, and we would have to choose between throughput and grind size. Assuming copper prices stay where they are, a second filter would only make sense if we increased production.",
 rd:{k:"Read in Daily Life",src:"Planning memo",text:"SCENARIO PLANNING – 2027 BUDGET\nScenario A (base): ore hardness unchanged; copper US$4.30/lb; throughput 65,000 t/d.\nScenario B (harder ore): A×b drops from 45 to 38; SAG capacity falls about 9%. Options: install pebble crusher #2 (US$12M) or accept lower throughput.\nScenario C (low price): copper US$3.60/lb. Priority: reduce cost per tonne; defer non-critical projects.\nNote: if scenarios B and C occur together, pebble crusher #2 would not pay back within 4 years.",
  q:[["What would happen to SAG capacity in Scenario B?",["It would fall about 9 percent","It would increase","It would not change","It would fall 45 percent"]],["What is the priority in the low-price scenario?",["Reducing cost per tonne","Installing a pebble crusher","Increasing throughput at any cost","Hiring more staff"]],["What can be inferred about pebble crusher #2?",["It is a good investment only if the price does not fall.","It should be installed immediately.","It reduces ore hardness.","It is already installed."]]]},
 lcr:[["What would you do if the ore got harder?",["I'd look at adding pebble crushing before cutting throughput.","I did it when it got harder.","The ore is hard.","If I would."]],["Suppose the price drops to three sixty. Then what?",["Then we'd have to defer the crusher and focus on cost per tonne.","Then the price drops.","Three sixty is low.","Suppose so."]],["Do you wish we had built a bigger mill?",["In hindsight, yes. It would have given us more flexibility now.","I wish a bigger mill.","Yes, I wish.","The mill is big enough, thanks."]],["Assuming we approve the project, when could it start?",["Realistically, in the second quarter.","Assuming yes.","We approved it.","It started."]]],
 ls:{k:"Listen to a Conversation",lines:[["A","Let's go through the scenarios. If the ore gets harder next year, what happens to throughput?"],["B","We'd lose about nine percent at the SAG, unless we add pebble crushing."],["A","And if we added the second pebble crusher, would we recover all of it?"],["B","Most of it, maybe seven of the nine points."],["A","What if the copper price drops at the same time?"],["B","Then the payback would stretch beyond four years, and I wouldn't recommend it."],["A","So your recommendation depends on the price outlook."],["B","Exactly. I'd prepare the engineering now, but wait to commit the money until mid-year."]],
  q:[["How much of the lost throughput would the pebble crusher recover?",["About seven of the nine points","All of it","None","About two points"]],["Under which condition would he not recommend the crusher?",["If the copper price drops at the same time","If the ore gets harder","If the engineering is ready","If throughput increases"]],["What does he propose?",["Prepare the engineering now and decide on the money later","Build the crusher immediately","Cancel the project","Reduce throughput now"]]]},
 em:{to:"Steve, the planning engineer",sit:"Steve asked for your view on the 2027 scenarios.",pts:["Explain what you would do in the harder-ore scenario","Explain how a low copper price would change your view","Make a recommendation with a timing"]},
 iv:["If you could change one thing in your plant or university, what would it be and why?","What would you have done differently in your last project?","Imagine your plant's ore gets much harder. How would you prepare?"]},

b2u5:{cw:"The investigator asked who had removed the guard from the pump. The operator said that it had been removed by a contractor during the morning shift. The pump should have been isolated before anyone worked on it, and the permit should have been checked by the supervisor.",
 rd:{k:"Read in Daily Life",src:"Near miss report",text:"NEAR MISS REPORT NM-2026-031\nWhat happened: On May 3 at 10:40, an operator found pump P-14 running with its coupling guard removed. A contractor was preparing to adjust the pump's packing.\nImmediate cause: the pump had not been isolated or locked out; the work permit was for pump P-15.\nUnderlying causes: pumps P-14 and P-15 are not clearly labeled in the field; the permit was not verified at the equipment.\nCorrective actions: install new equipment tags (due May 20); require supervisors to verify permits at the equipment (effective immediately); include this case in the next safety training.",
  q:[["What was the immediate cause of the near miss?",["The pump was not isolated, and the permit was for another pump.","The contractor was not trained.","The guard was broken.","The operator started the wrong pump."]],["Which underlying cause is mentioned?",["Poor equipment labeling in the field","Lack of PPE","A broken lock","Bad weather"]],["Which corrective action starts immediately?",["Supervisors must verify permits at the equipment.","New equipment tags","A new pump","Safety training next year"]]]},
 lcr:[["Who removed the guard?",["According to the operator, it was removed by the contractor.","The guard removed itself.","I removed who.","It was a guard."]],["What should have happened before the work started?",["The pump should have been isolated and locked out.","It should happen.","Work starts at seven.","The pump was working."]],["Did anyone check the permit?",["The supervisor said he had checked it, but not at the equipment.","Yes, he checks.","The permit is checked.","Anyone did."]],["Was anyone hurt?",["No, fortunately it was a near miss.","Yes, it was a near miss.","Hurt is bad.","Anyone was."]]],
 ls:{k:"Listen to a Conversation",lines:[["A","Thanks for coming. Can you tell me what you saw on Wednesday morning?"],["B","Sure. At about ten forty I walked past pump fourteen and noticed the coupling guard was off, and the pump was running."],["A","What did you do?"],["B","I told the contractor to step back, and I called the control room to stop the pump."],["A","Did the contractor say why he was working on that pump?"],["B","He said his permit was for that pump. Later we saw it was actually for pump fifteen."],["A","In your view, why did that happen?"],["B","Honestly, the tags in the field are hard to read. Fourteen and fifteen look the same from the walkway."]],
  q:[["What did the operator do first?",["He told the contractor to step back.","He stopped the pump himself.","He wrote a report.","He called the safety department."]],["What did they find out about the permit?",["It was for pump fifteen, not fourteen.","It was missing.","It was expired.","It was correct."]],["What does the operator think is the root problem?",["The equipment tags are hard to read.","The contractor was careless.","The pumps are old.","The control room was slow."]]]},
 em:{to:"Angela, the HSE investigator",sit:"You witnessed a near miss. Send Angela a written statement.",pts:["Describe what you saw, with times","Report what other people said, using reported speech","Say what should have been done differently"]},
 iv:["Describe a near miss or incident you have seen and what was learned.","Why do some workers not report near misses, and how can that change?","What should a supervisor do right after an incident?"]},

 rd:{k:"Read in Daily Life",src:"Company newsletter",text:"COPPER RIDGE WEEKLY – COMMUNITY CORNER\nThanks to everyone who joined the Saturday hike at Sabino Canyon! Twenty-two employees and family members made it to the top. Next month: the annual chili cook-off on October 18 at the community center. Sign up by October 10 if you want to compete. Last year's winner, Carlos from the lab, says he's 'not worried at all.' Also, congratulations to Jake Miller and his wife on the birth of their daughter, Lily!",

 lcr:[["How was your weekend?",["Great, thanks! I went hiking at Sabino Canyon. How about yours?","It was a weekend.","Yes, it was.","I'm fine, and you?"]],["Did you watch the game last night?",["I caught the second half. What a finish!","I watched the game last night.","Yes, the game.","Last night, yes, I did watch."]],["It's supposed to hit a hundred and ten this weekend.",["Wow, that's hot! I'll stay inside with the AC.","Yes, it's supposed.","That's a lot of weekend.","I hit it too."]],["We should grab lunch sometime.",["Sure, how about Thursday?","Yes, we should grab.","I grab lunch every day.","Sometime is good, thanks."]]],
 ls:{k:"Listen to a Conversation",lines:[["A","Hey Luis, how was your weekend?"],["B","Pretty good! I finally did the Sabino Canyon hike."],["A","Oh nice! Did you go all the way to the top?"],["B","I did, but I started too late. By ten it was already crazy hot."],["A","Yeah, you've got to start at like five in the summer. Lesson learned, huh?"],["B","Definitely. How about you? Anything fun?"],["A","Not really, just a lazy Sunday. Watched the game, did some laundry. Oh, and we're doing the chili cook-off next month. You should sign up!"],["B","Me? I've never made chili in my life."],["A","That's the spirit! Nobody cares. It's just for fun."]],

c1u1:{cw:"It is fair to say that the new classifier has improved the grind, at least to some extent. Strictly speaking, however, we cannot attribute the full increase in recovery to it, since the ore was considerably softer during the same period. A more cautious conclusion would be that the classifier appears to have contributed roughly half of the gain.",
 rd:{k:"Read an Academic Passage",src:"Essay",text:"THE LANGUAGE OF UNCERTAINTY IN TECHNICAL REPORTING\nTechnical reports that overstate their conclusions can be as damaging as those that contain errors. A statement such as 'the new reagent increased recovery by 2%' implies a causal certainty that plant data seldom support. Experienced authors therefore qualify their claims in proportion to the evidence: they distinguish between what was measured, what can reasonably be inferred, and what remains speculative. Hedging, in this sense, is not a sign of weakness but of precision. Senior decision-makers rely on these distinctions to judge how much risk they are taking when they act on a recommendation. Equally, however, excessive hedging can obscure a clear message; the skill lies in calibrating confidence rather than avoiding commitment.",
  q:[["According to the passage, why is hedging valuable?",["It signals how strongly the evidence supports a claim.","It makes reports longer and more formal.","It protects authors from criticism.","It is required by managers."]],["What risk does the author associate with excessive hedging?",["It can hide the main message.","It increases the cost of reports.","It makes readers overconfident.","It eliminates uncertainty."]],["What does 'calibrating confidence' most likely mean?",["Matching the strength of a claim to the strength of the evidence","Measuring instruments regularly","Being confident in every statement","Avoiding any conclusion"]]]},
 lcr:[["So the classifier increased recovery by two points?",["That's probably overstating it. It likely accounts for about half of that.","Yes, by two points, so.","The classifier is new.","It's fair."]],["Can you say for certain that the ore caused it?",["Not for certain, but the evidence points strongly in that direction.","Yes, for certain, I can say.","The ore is certain.","For certain it can."]],["Isn't your sample size a bit small?",["It is, which is why I'd treat these results as preliminary.","Small is the size.","Yes, a bit small sample.","It isn't a sample."]],["Would you stake your reputation on that number?",["Not on the exact figure, but I'm confident about the direction of the effect.","My reputation is good.","Yes, I'd stake.","The number is staked."]]],
 ls:{k:"Listen to an Academic Talk",lines:[["A","Your report claims the classifier upgrade added two points of recovery. That's a strong statement."],["B","Fair enough. I'd put it more carefully: recovery rose by two points over the period, and the classifier likely accounts for a substantial part of that."],["A","How substantial?"],["B","Our best estimate is roughly half. The ore was noticeably softer in the second month, which by itself would have improved the grind."],["A","And the other half?"],["B","Strictly speaking, we can't separate it cleanly. The on-off comparison we ran was short, so I'd treat it as indicative rather than conclusive."],["A","That's a far more defensible position. I'd suggest you rewrite the executive summary accordingly."],["B","Agreed. I'll make sure the headline matches the strength of the evidence."]],
  q:[["How does the speaker revise his original claim?",["He attributes about half of the gain to the classifier.","He withdraws the claim entirely.","He says the classifier added more than two points.","He blames the ore for the drop."]],["Why can't the remaining effect be separated cleanly?",["The on-off comparison was short.","The data was lost.","The classifier was removed.","The ore was harder."]],["What does the consultant recommend?",["Rewriting the executive summary to match the evidence","Running no more tests","Removing the classifier","Hiring another consultant"]]]},
 em:{to:"Dr. Hughes, a senior consultant",sit:"Dr. Hughes said your report overstates its conclusions. Send a revised key finding.",pts:["Restate the main finding with appropriate hedging","Explain the main source of uncertainty","Propose how to reduce that uncertainty"]},
 iv:["Tell me about a conclusion you had to qualify or revise. Why?","How do you communicate uncertainty to managers who want a simple answer?","Is it ever better to give a confident answer even when you're not sure? Explain."]},

c1u2:{cw:"As the chair, my job is to keep the meeting on track and make sure everyone is heard. When the discussion drifted into a debate about the lab budget, I suggested we park that topic and circle back to it at the end. We finished on time with three clear action items, each with an owner and a deadline.",
 rd:{k:"Read in Daily Life",src:"Meeting minutes",text:"CROSS-FUNCTIONAL MEETING – CONCENTRATOR / MAINTENANCE / MINE PLANNING / LAB\nChair: L. Torres\nItem 1 – Ore blend for next week: Mine Planning will send 60% north pit ore. Concern raised (Lab): high clay may affect filtration. Decision: Lab to run settling tests by Wednesday.\nItem 2 – SAG mill liner change: Maintenance confirmed the stop for the 22nd. Concentrator asked to move it to the 24th; not possible due to contractor availability.\nParking lot: Lab sampling budget (to be discussed with the plant manager).\nAction items: (1) Settling tests – Lab (S. Reyes) – Wed. (2) Revised blend plan – Mine Planning (D. Kim) – Thu. (3) Shutdown communication – Concentrator (L. Torres) – Fri.",
  q:[["Why was the lab concerned about the ore blend?",["High clay could affect filtration.","The ore was too hard.","There were not enough samples.","The blend was too expensive."]],["What happened to the request to move the liner change?",["It was rejected because of contractor availability.","It was accepted.","It was postponed to another meeting.","It was sent to the plant manager."]],["What does 'parking lot' refer to in these minutes?",["A topic set aside to be discussed later","A place to leave vehicles","A decision already made","An action item for the lab"]]]},
 lcr:[["Sorry, can I just jump in here?",["Sure, go ahead, but let's keep it brief so we stay on schedule.","Jump in where?","Yes, you can jump.","Sorry, no."]],["I think we're getting a bit sidetracked.",["You're right. Let's park the budget question and circle back at the end.","Yes, the track is side.","I'm sidetracked too.","Let's get more sidetracked."]],["Who's going to own this action?",["Sandra will, with a deadline of Wednesday.","The action is owned.","Who's going to.","I own a car."]],["We've run out of time. What's the next step?",["I'll send the action items today, and we'll follow up on Friday.","Time is out.","The next step is next.","We ran."]]],
 ls:{k:"Listen to a Conversation",lines:[["B","OK, let's get started. We have three items and forty-five minutes. First, the ore blend for next week. Dan?"],["C","Mine planning wants to send sixty percent north pit ore. It's what we have available."],["A","Can I just jump in? That ore had a lot of clay last time, and the filters struggled."],["C","Sure, but if we don't take it, we fall behind on the mine plan."],["B","Let's not turn this into a debate on the mine plan. Sandra, what would you need to be comfortable?"],["A","Settling tests on a sample by Wednesday."],["B","Dan, can you get her a sample tomorrow?"],["C","I can do that."],["B","Great. So, action: settling tests by Wednesday, Sandra owns it. Let's move on to the shutdown."]],
  q:[["What is Sandra's concern?",["Clay in the north pit ore could cause filter problems.","The meeting is too long.","The shutdown date is wrong.","Mine planning is behind schedule."]],["How does the chair handle the disagreement?",["He refocuses the discussion on what Sandra needs.","He supports mine planning.","He cancels the item.","He postpones the decision to next month."]],["What is agreed?",["Dan provides a sample and Sandra runs settling tests by Wednesday.","The ore blend is canceled.","Sandra changes the filters.","The shutdown is moved."]]]},
 em:{to:"All meeting participants",sit:"Send the follow-up email after the cross-functional meeting you chaired.",pts:["Summarize the key decisions","List each action item with an owner and a deadline","Mention the parked topic and how it will be handled"]},
 iv:["How do you handle a participant who dominates a meeting?","Tell me about a meeting you led that didn't go well. What did you learn?","What makes a meeting worth everyone's time?"]},

c1u3:{cw:"The bottom line is that a four-million-dollar flotation upgrade would pay for itself in about fourteen months. I would argue that the main risk is not technical but operational, since the crews need time to adapt to the new cells. We plan to mitigate that risk with a phased start-up and a training program.",
 rd:{k:"Read in Daily Life",src:"Business case",text:"BUSINESS CASE – CLEANER FLOTATION UPGRADE\nInvestment: US$4.1M (equipment US$3.2M, installation US$0.6M, contingency US$0.3M)\nExpected benefit: +1.5 points copper recovery = about 2,600 t/year of additional copper in concentrate.\nValue: about US$3.5M/year at US$4.00/lb, after treatment and refining charges.\nPayback: 14 months. NPV (8%, 5 years): US$9.2M.\nKey risks: (1) recovery gain lower than expected – pilot data show a range of +1.0 to +2.0 points; (2) installation delays during the shutdown; (3) operator learning curve.\nMitigation: performance guarantee from the supplier; installation in two phases; training before commissioning.\nSensitivity: at +1.0 point, payback extends to 21 months.",
  q:[["What is included in the US$4.1M investment?",["Equipment, installation and contingency","Only the equipment","Equipment and five years of operation","Training and salaries"]],["What happens to the payback if the gain is only +1.0 point?",["It extends to 21 months.","It shortens to 14 months.","The project loses money.","It stays the same."]],["Which risk does the supplier guarantee address?",["A lower-than-expected recovery gain","Installation delays","The operator learning curve","Copper price changes"]]]},
 lcr:[["What's the bottom line?",["Four million dollars, paid back in about fourteen months.","The bottom line is at the bottom.","It's a line.","Fourteen is the line."]],["What if the recovery gain is only one point?",["Then the payback stretches to about twenty-one months, which is still acceptable.","If it is one point.","One point is a gain.","Then it's one."]],["Why should we do this now and not next year?",["Because every month we wait costs us roughly three hundred thousand dollars in lost copper.","Because now is now.","Next year is far.","We should do it next year."]],["How confident are you in the pilot data?",["Reasonably confident in the range, less so in the upper end.","I'm confident, yes, the data.","The pilot is confident.","Pilot data is data."]]],
 ls:{k:"Listen to a Conversation",lines:[["B","Thank you for your time. I'll keep this short. We're asking for four point one million dollars to upgrade the cleaner flotation circuit."],["A","What do we get for it?"],["B","About one and a half points of recovery, which is roughly three and a half million dollars a year. Payback is around fourteen months."],["A","Those pilot numbers always look good. What if you're wrong?"],["B","That's a fair concern. The pilot range was one to two points. At the low end, payback is twenty-one months, and we've negotiated a performance guarantee with the supplier."],["A","And the shutdown? I can't afford another delay like last year."],["B","We'd install in two phases, so neither stop is longer than our planned liner change."],["A","Send me the sensitivity analysis. If it holds, I'll take it to the board."]],
  q:[["How does the engineer respond to the doubt about the pilot numbers?",["He gives the low-end scenario and mentions the supplier guarantee.","He insists the numbers are certain.","He offers to repeat the pilot.","He lowers the investment."]],["What is the general manager's concern about the shutdown?",["Avoiding another delay like last year","The cost of the contractor","Safety during installation","The training program"]],["What will the general manager do if the sensitivity analysis holds?",["Take the project to the board","Approve it herself immediately","Ask for a new pilot","Reject it"]]]},
 em:{to:"Robert, the general manager",sit:"Robert asked for a one-paragraph summary of your flotation upgrade proposal before the board meeting.",pts:["State the investment, benefit and payback","Address the main risk and its mitigation","Make a clear request"]},
 iv:["Convince me that your plant should invest in a project you believe in.","How do you present bad news to senior management?","Tell me about a time you had to defend a recommendation with limited data."]},

c1u4:{cw:"When the vice president challenged my analysis in front of the team, I took a moment before answering. I acknowledged that her point about the sampling error was valid, but I explained that it could not account for a difference of that size. I also said that I was not in a position to comment on the contract terms, and offered to follow up with procurement.",
 rd:{k:"Read in Daily Life",src:"Email",text:"From: Diane Brooks, VP Operations\nSubject: Today's review\n\nLuis,\nI pushed hard on your analysis today, and I appreciate that you didn't get defensive. You were right that sampling error can't explain a 3-point gap, and I should have read the appendix before the meeting. That said, I'm still not convinced the contractor is the main cause. Before we escalate this with them, I want an independent check of the metallurgical balance by the corporate team. Please set that up and copy me.\nDiane",
  q:[["What does Diane admit in the email?",["She should have read the appendix before the meeting.","Her analysis was wrong.","Luis was defensive.","The contractor is the cause."]],["What is Diane still not convinced about?",["That the contractor is the main cause","That sampling error exists","That the gap is three points","That the appendix is correct"]],["What does Diane ask Luis to do?",["Arrange an independent check of the metallurgical balance","Escalate the issue with the contractor","Rewrite the appendix","Apologize to the team"]]]},
 lcr:[["Frankly, I don't buy your numbers.",["I take your point. Let me walk you through how we got them.","Numbers are not for sale.","Frankly, yes.","Then don't buy them."]],["Isn't this just sampling error?",["Sampling error is real, but it's about half a point at most, so it can't explain a three-point gap.","It isn't just.","Yes, sampling is error.","Error is everywhere."]],["Why didn't you raise this earlier?",["Fair question. We only had enough data to be confident last week.","Because I didn't raise.","Earlier it was early.","I raised it now, yes."]],["Are you saying the contractor is at fault?",["I'm not in a position to say that yet. What I can say is where the losses occur.","Yes, I'm saying.","The contractor is a fault.","At fault, no, yes."]]],
 ls:{k:"Listen to a Conversation",lines:[["A","Let me stop you there. You're telling me we've lost three points of recovery for six months and nobody noticed?"],["B","We noticed a trend, but it was within the normal range until March. Once it wasn't, we started the investigation."],["A","Frankly, that sounds like an excuse."],["B","I understand why it might sound that way. With all due respect, the monthly data simply didn't show it until we had enough samples. I can show you the control chart."],["A","Fine. And you think the contractor's sampling is the issue?"],["B","What I can say is that the losses are concentrated in the coarse fraction of the tails. Whether that's the contractor's responsibility is something I'm not in a position to judge. That's a contract question."],["A","Then who is?"],["B","Procurement and legal. I'd be happy to set up a meeting with them this week."]],
  q:[["How does the engineer respond when his explanation is called an excuse?",["He acknowledges her view and offers evidence.","He apologizes and withdraws.","He blames the contractor.","He ends the meeting."]],["What does the engineer say with confidence?",["The losses are concentrated in the coarse fraction of the tails.","The contractor is responsible.","Sampling error explains the gap.","The trend started in January."]],["Why does he avoid blaming the contractor?",["It is a contractual question outside his expertise.","He is afraid of the contractor.","The data shows the contractor is not involved.","The vice president told him not to."]]]},
 em:{to:"Diane, the VP of operations",sit:"Reply to Diane's email after the tense review meeting.",pts:["Acknowledge her message professionally","Confirm the independent check with a timeline","Restate briefly what the evidence does and does not show"]},

c1u5:{cw:"After the week we had, Mark said the plant was running like a dream, which of course meant the exact opposite. He also mentioned that the new contractor was very creative with the procedures, a polite way of saying they had ignored them. Reading between the lines, he was asking me to raise the issue with management.",
 rd:{k:"Read in Daily Life",src:"Text message",text:"Mark (Friday, 6:42 p.m.):\nWell, that was a week for the books. Filter 2 decided to take a vacation on Tuesday, the new collector supplier delivered the wrong product (twice!), and the contractor's 'improved' sampling procedure gave us numbers that would make anyone's recovery look amazing. On the bright side, nobody got hurt, and Jenny's cookies were excellent. I'm not going to be the one to tell Diane about the sampling, by the way. Just saying. Enjoy the weekend!",
  q:[["What does Mark mean when he says Filter 2 'decided to take a vacation'?",["The filter broke down.","The filter was cleaned.","The filter operator was on holiday.","The filter worked well."]],["What does Mark suggest about the contractor's sampling procedure?",["It gives misleadingly high results.","It is a clear improvement.","It is too slow.","Diane approved it."]],["What is Mark implying with 'I'm not going to be the one to tell Diane'?",["He hopes the reader will tell Diane.","He will tell Diane on Monday.","Diane already knows.","Nobody should tell Diane."]]]},
 lcr:[["Well, that went well.",["You mean it was a disaster? Yeah, I noticed.","Yes, it went very well, I agree completely.","It went where?","Well is good."]],["I'm not saying the new supplier is bad, but...",["...but you wouldn't renew their contract?","...but they are good.","Not saying is fine.","The supplier is new."]],["Let's just say Diane wasn't thrilled.",["Uh-oh. How upset was she?","Great, she was thrilled!","Let's just say it.","Diane is a person."]],["That's a bit of a tall order by Friday.",["I know it's tight. Which part could you deliver by Friday?","Tall orders are good.","Friday is a tall day.","Yes, it's tall."]]],
 ls:{k:"Listen to a Conversation",lines:[["A","So, how was your first week as shift lead? Smooth sailing?"],["B","Not exactly. Filter two went down on Tuesday and the reagent delivery was wrong."],["A","Ah, the classic Tuesday. Don't worry, it's not like we had a production target or anything."],["B","Very funny. Did Diane say anything?"],["A","Let's just say she's looking forward to your report."],["B","That doesn't sound good."],["A","It's not the end of the world. But if I were you, I wouldn't wait until Monday to send it. And I'd mention the contractor's sampling. Just saying."],["B","Got it. I'll send it tonight."],["A","Good man. Now go home."]],
  q:[["What does she mean by 'it's not like we had a production target or anything'?",["The problems clearly affected an important target.","There was no target this week.","The target was too low.","She doesn't care about targets."]],["What does she imply about Diane?",["Diane is unhappy and expects a good report.","Diane is excited to read the report.","Diane will be on vacation.","Diane already fixed the problems."]],["What advice does she give, indirectly?",["Send the report early and mention the sampling issue.","Wait until Monday.","Avoid mentioning the contractor.","Ask Diane for more time."]]]},
 em:{to:"Mark, a senior engineer",sit:"Mark sent you a sarcastic message about a terrible week and hinted that someone should tell Diane about the sampling problem.",pts:["Show you understood what he implied","Say what you plan to do","Keep a friendly, informal tone with one idiom"]},
 iv:["Tell me about a time someone said one thing but meant another at work.","Which American expressions or idioms do you find most confusing?","How do you handle sarcasm or humor from coworkers in a second language?"]},

c1u6:{cw:"The situation was a sudden drop in recovery after a change of ore. My task was to find the cause within a week, so I organized daily sampling and a series of lab tests. As a result, we identified a depressant problem and recovered two points; looking back, I would have involved the mine geologists earlier.",
 rd:{k:"Read in Daily Life",src:"Interview guide",text:"BEHAVIORAL INTERVIEW – SENIOR METALLURGIST\nWe use the STAR method: describe the Situation, your Task, the Action you took and the Result. Interviewers will ask follow-up questions to understand your personal contribution, so use 'I' rather than 'we' when describing your actions. Quantify results whenever possible. We are especially interested in examples of: leading change; managing conflict; making decisions with incomplete information; learning from failure. Answers of two to three minutes are ideal.",
  q:[["Why should candidates use 'I' instead of 'we'?",["Interviewers want to understand the candidate's own contribution.","It sounds more confident.","Teamwork is not valued.","It is shorter."]],["Which kind of example is the company especially interested in?",["Learning from failure","Technical calculations","Salary negotiations","Academic grades"]],["How long should answers be?",["Two to three minutes","Thirty seconds","Ten minutes","As long as needed"]]]},
 lcr:[["Tell me about a time you failed.",["In my first trial as project lead, I changed two variables at once, and the results were inconclusive. What I learned was...","I never fail.","Yes, I failed one time.","Failure is part of life, thanks."]],["What exactly was your role, as opposed to the team's?",["I designed the test plan and personally analyzed the results.","The team did everything.","My role was a role.","We were all the team."]],["Looking back, what would you do differently?",["I'd involve the geologists from day one instead of week three.","Nothing, it was perfect.","I'd look back.","Differently, yes."]],["How did you measure the result?",["Recovery went from eighty-three to eighty-five percent over the following month.","I measured it well.","With a meter.","The result was measured."]]],
 ls:{k:"Listen to a Conversation",lines:[["A","Tell me about a time you had to make a decision with incomplete information."],["B","Sure. Last year, our cleaner circuit started losing grade overnight, and the lab results were delayed by a power outage."],["A","What was at stake?"],["B","Our concentrate was close to the penalty limit for zinc, and a shipment was due in two days."],["A","And what did you do?"],["B","I used the on-stream analyzer trends and two quick hand assays to decide to increase the depressant, knowing the analyzer might be off. I also set a rule: if the next lab result disagreed, we'd reverse it."],["A","How did it turn out?"],["B","The lab confirmed the trend, and the shipment met spec. Looking back, I'd document the decision rule earlier, so the night shift could act without calling me."]],
  q:[["Why did he have incomplete information?",["Lab results were delayed by a power outage.","The analyzer was broken.","The night shift didn't report.","The shipment was canceled."]],["What did he do to manage the risk of being wrong?",["He set a rule to reverse the action if the lab disagreed.","He waited for the lab results.","He stopped the plant.","He asked his manager to decide."]],["What would he do differently?",["Document the decision rule earlier for the night shift","Avoid using the analyzer","Increase the depressant more","Delay the shipment"]]]},
 em:{to:"Christine, the hiring manager",sit:"After your final interview, send a thank-you email.",pts:["Thank her and mention one specific topic from the interview","Add one result or detail you forgot to mention","Restate your interest and the next steps"]},
 iv:["Tell me about a time you led a change that people resisted.","Describe a decision you made with incomplete information.","Tell me about your biggest professional mistake and what you learned."]}

/* ---------- normalización de lo dicho ---------- */
const ONES=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
const TENS=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
function n2w(n){
  n=Math.floor(n);if(n<20)return ONES[n];
  if(n<100)return TENS[Math.floor(n/10)]+(n%10?' '+ONES[n%10]:'');
  if(n<1000)return ONES[Math.floor(n/100)]+' hundred'+(n%100?' '+n2w(n%100):'');
  for(const [v,w] of [[1e9,'billion'],[1e6,'million'],[1e3,'thousand']])if(n>=v)return n2w(Math.floor(n/v))+' '+w+(n%v?' '+n2w(n%v):'');
  return String(n);
}
const ORD={'1st':'first','2nd':'second','3rd':'third','4th':'fourth','5th':'fifth','6th':'sixth','7th':'seventh','8th':'eighth','9th':'ninth','10th':'tenth'};
const CONTR=[[/\bcan't\b/g,'can not'],[/\bcannot\b/g,'can not'],[/\bwon't\b/g,'will not'],[/\bshan't\b/g,'shall not'],[/\bain't\b/g,'is not'],[/n't\b/g,' not'],
  [/\blet's\b/g,'let us'],[/'m\b/g,' am'],[/'re\b/g,' are'],[/'ve\b/g,' have'],[/'ll\b/g,' will'],[/'d\b/g,' would'],
  [/\b(it|that|what|where|there|here|who|how|he|she)'s\b/g,'$1 is']];
const EQUIV={dont:'do not',cant:'can not',isnt:'is not',arent:'are not',wasnt:'was not',werent:'were not',didnt:'did not',doesnt:'does not',havent:'have not',hasnt:'has not',couldnt:'could not',wouldnt:'would not',shouldnt:'should not',im:'i am',ive:'i have',youre:'you are',theyre:'they are',lets:'let us',thats:'that is',whats:'what is',theres:'there is',sometime:'some time',anytime:'any time',everyday:'every day',alright:'all right',tonnes:'tons',tonne:'ton',okay:'ok','o.k.':'ok',gonna:'going to',wanna:'want to',gotta:'got to',grey:'gray',metre:'meter',metres:'meters',litre:'liter',litres:'liters',centre:'center',per:'per',hrs:'hours',hr:'hour',mins:'minutes',min:'minutes'};
function norm(s){
  s=String(s||'').toLowerCase().replace(/[’‘`´]/g,"'").replace(/[“”]/g,'"');
  s=s.replace(/\ba\.m\./g,'am').replace(/\bp\.m\./g,'pm').replace(/\bu\.s\.a?\.?/g,'us').replace(/\bmr\./g,'mister').replace(/\bdr\./g,'doctor');
  s=s.replace(/\$(\d[\d,]*(?:\.\d+)?)\s*(million|billion|thousand)?/g,(m,a,b)=>a+(b?' '+b:'')+' dollars');
  s=s.replace(/(\d),(\d{3})/g,'$1$2').replace(/(\d),(\d{3})/g,'$1$2');
  s=s.replace(/(\d+)\s*%/g,'$1 percent');
  s=s.replace(/\b(\d{1,2}):(\d{2})\b/g,(m,h,mi)=>n2w(+h)+(+mi===0?'':(+mi<10?' oh '+n2w(+mi):' '+n2w(+mi))));
  s=s.replace(/\b(\d+)(st|nd|rd|th)\b/g,(m)=>ORD[m]||m.replace(/\D/g,''));
  s=s.replace(/\b(\d+)\.(\d+)\b/g,(m,a,b)=>n2w(+a)+' point '+b.split('').map(d=>ONES[+d]).join(' '));
  s=s.replace(/\b\d+\b/g,m=>m.length>12?m:n2w(+m));
  CONTR.forEach(([r,v])=>{s=s.replace(r,v);});
  s=s.replace(/[-–—/]/g,' ').replace(/[^a-z0-9'\s]/g,' ').replace(/'/g,'');
  let t=s.split(/\s+/).filter(Boolean).map(w=>EQUIV[w]||w).join(' ').split(' ');
  const out=[];let letters=false;
  for(const w of t){const single=w.length===1&&!/^[ai]$/.test(w);if(single&&letters)out[out.length-1]+=w;else{out.push(w);letters=single;}}
  return out.join(' ').replace(/\bwi fi\b/g,'wifi').split(' ').filter(Boolean);
}
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;const d=Array.from({length:m+1},(_,i)=>[i]);for(let j=1;j<=n;j++)d[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n];}
function near(a,b){if(a===b)return true;if(Math.min(a.length,b.length)<4)return false;return lev(a,b)/Math.max(a.length,b.length)<=0.25;}
/* alineación palabra a palabra entre lo esperado y lo dicho */
function align(target,said){
  const T=norm(target),H=norm(said),m=T.length,n=H.length;
  const D=Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=0;i<=m;i++)D[i][0]=i;for(let j=0;j<=n;j++)D[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++){const c=T[i-1]===H[j-1]?0:near(T[i-1],H[j-1])?0.5:1;D[i][j]=Math.min(D[i-1][j]+1,D[i][j-1]+1,D[i-1][j-1]+c);}
  const ops=[];let i=m,j=n;
  while(i>0||j>0){
    if(i>0&&j>0){const c=T[i-1]===H[j-1]?0:near(T[i-1],H[j-1])?0.5:1;if(D[i][j]===D[i-1][j-1]+c){ops.push({t:T[i-1],h:H[j-1],k:c===0?'ok':c===0.5?'near':'sub'});i--;j--;continue;}}
    if(i>0&&D[i][j]===D[i-1][j]+1){ops.push({t:T[i-1],h:null,k:'miss'});i--;continue;}
    ops.push({t:null,h:H[j-1],k:'extra'});j--;
  }
  ops.reverse();
  const ok=ops.filter(o=>o.k==='ok').length,nr=ops.filter(o=>o.k==='near').length,ex=ops.filter(o=>o.k==='extra').length;
  const score=m?clamp((ok+0.5*nr-0.5*Math.max(0,ex-1))/m,0,1):0;
  return {ops,score,T,H};
}
function diffHTML(al){
  return '<span class="diff">'+al.ops.map(o=>{
    if(o.k==='ok')return `<span class="w ok">${esc(o.t)}</span>`;
    if(o.k==='near')return `<span class="w near" title="Dijiste: ${esc(o.h)}">${esc(o.t)}</span>`;
    if(o.k==='sub')return `<span class="w sub"><s>${esc(o.h)}</s> ${esc(o.t)}</span>`;
    if(o.k==='miss')return `<span class="w miss">${esc(o.t)}</span>`;
    return `<span class="w extra">+${esc(o.h)}</span>`;
  }).join(' ')+'</span>';
}

function mergeState(o){
  if(!o||typeof o!=='object')return;
  ['name','unit','voice','voice2'].forEach(k=>{if(o[k]&&!ST[k])ST[k]=o[k];});
  Object.entries(o.passed||{}).forEach(([k,v])=>{if(!ST.passed[k])ST.passed[k]=v;});
  Object.entries(o.srs||{}).forEach(([k,v])=>{const c=ST.srs[k];if(!c||(v.n||0)>(c.n||0))ST.srs[k]=v;});
  Object.entries(o.units||{}).forEach(([k,v])=>{const c=ST.units[k]||{};ST.units[k]={rp:Math.max(c.rp||0,v.rp||0),tk:Object.assign({},v.tk||{},c.tk||{}),ls:Math.max(c.ls||0,v.ls||0)};
    Object.entries(v.tk||{}).forEach(([i,s])=>{ST.units[k].tk[i]=Math.max(s,(c.tk||{})[i]||0);});});
  Object.entries(o.pairs||{}).forEach(([k,v])=>{const c=ST.pairs[k];if(!c||(v.n||0)>(c.n||0))ST.pairs[k]=v;});
  Object.entries(o.days||{}).forEach(([k,v])=>{const c=ST.days[k];if(!c||(v.sec||0)>(c.sec||0))ST.days[k]=v;});
  Object.entries(o.custom||{}).forEach(([k,v])=>{if(!ST.custom[k])ST.custom[k]=v;});
  Object.entries(o.exams||{}).forEach(([k,v])=>{if(!ST.exams[k]||(v.length||0)>(ST.exams[k].length||0))ST.exams[k]=v;});

function newChunksFrom(uid,limit){

/* ---------- dominio ---------- */
function unitMastery(u){
  const ch=u.ch.map((c,i)=>Math.min(MASTER_BOX,srsGet(u.id+'-'+i).b||0)/MASTER_BOX);
  const chP=ch.reduce((a,b)=>a+b,0)/ch.length;
  const r=ST.units[u.id]||{};
  const tk=[0,1].map(i=>((r.tk||{})[i]||0)>=3?1:0).reduce((a,b)=>a+b,0)/2;
  const rp=(r.rp||0)>=3?1:0;
  const ls=Math.min(2,r.ls||0)/2;
  return {total:0.5*chP+0.25*tk+0.15*rp+0.10*ls,chP,tk,rp,ls};
}
function levelMastery(lv){
  const us=UNITS.filter(u=>u.lv===lv);
  const m=us.reduce((a,u)=>a+unitMastery(u).total,0)/us.length;
  return 0.8*m+(ST.passed[lv]?0.2:0);
}

const TTS={ok:'speechSynthesis' in window,voices:[],speaking:false,gen:0,checked:false,broken:false,unlocked:false};
const VOICE_PREF=[/Google US English/i,/Ava/i,/Samantha/i,/Allison/i,/Aria/i,/Jenny/i,/Guy/i,/Michelle/i,/Christopher/i,/Eric/i,/Zira/i,/David/i,/Mark/i,/Alex/i,/Fred/i];
function loadVoices(){
  if(!TTS.ok)return;
  try{TTS.voices=(speechSynthesis.getVoices()||[]).filter(v=>/^en[-_]US/i.test(v.lang));}catch(e){TTS.voices=[];}
  TTS.voices.sort((a,b)=>{const ia=VOICE_PREF.findIndex(r=>r.test(a.name)),ib=VOICE_PREF.findIndex(r=>r.test(b.name));return (ia<0?99:ia)-(ib<0?99:ib);});
  if(typeof onVoices==='function')onVoices();
}
if(TTS.ok){setTimeout(loadVoices,0);try{speechSynthesis.onvoiceschanged=loadVoices;}catch(e){}setTimeout(loadVoices,800);}
function voiceBy(name,fallbackIdx){return TTS.voices.find(v=>v.name===name)||TTS.voices[fallbackIdx||0]||null;}
function voiceA(){return voiceBy(ST.voice,0);}
function voiceB(){const a=voiceA();if(ST.voice2){const v=TTS.voices.find(x=>x.name===ST.voice2);if(v)return v;}return TTS.voices.find(v=>a&&v.name!==a.name)||a;}
function baseRate(){const lv=workUnit().lv;return (LEVELS[LV_IDX[lv]].rate)*(ST.rate||1);}
function hush(){TTS.gen++;TTS.speaking=false;if(TTS.ok){try{speechSynthesis.cancel();}catch(e){}}setWave(false);}
function splitSent(t){return String(t).match(/[^.!?]+[.!?]*["')\]]*\s*/g)||[String(t)];}
/* lines: [{t, v:'A'|'B'}] → reproduce en orden; resuelve al terminar */
function speakLines(lines,opts){
  opts=opts||{};
  return new Promise(resolve=>{
    if(!TTS.ok){resolve(false);return;}
    let busy=false;try{busy=speechSynthesis.speaking||speechSynthesis.pending;}catch(e){}
    hush();const g=++TTS.gen;
    const q=[];lines.forEach(l=>splitSent(sub(l.t)).forEach(s=>{if(s.trim())q.push({t:s.trim(),v:l.v||'A'});}));
    let started=false;
    const rate=clamp((opts.rate||baseRate())*(opts.slow?0.75:1),0.5,1.6);
    const next=i=>{
      if(g!==TTS.gen){resolve(false);return;}
      if(i>=q.length){TTS.speaking=false;setWave(false);resolve(true);return;}
      const u=new SpeechSynthesisUtterance(q[i].t);
      u.lang='en-US';u.rate=rate;
      try{const v=q[i].v==='B'?voiceB():voiceA();if(v)u.voice=v;}catch(e){}
      u.onstart=()=>{started=true;TTS.checked=true;TTS.speaking=true;setWave(true);if(TTS.broken){TTS.broken=false;if(typeof onTTSBroken==='function')onTTSBroken();}};
      u.onend=()=>next(i+1);
      u.onerror=()=>next(i+1);
      try{speechSynthesis.resume();speechSynthesis.speak(u);}catch(e){resolve(false);}
    };
    if(busy)setTimeout(()=>next(0),80);else next(0);
    if(!TTS.checked)setTimeout(()=>{if(g===TTS.gen&&!started&&!TTS.checked){TTS.broken=true;hush();if(typeof onTTSBroken==='function')onTTSBroken();resolve(false);}},3500);

const SRC=window.SpeechRecognition||window.webkitSpeechRecognition||null;

const STT={ok:!!SRC&&TOP&&!lsGet('cre_stt_blocked',false),rec:null,active:false};
function sttStart(box,onDone){
  if(!STT.ok)return false;
  try{
    const r=new SRC();r.lang='en-US';r.interimResults=true;r.continuous=false;r.maxAlternatives=1;
    const base=box.value?box.value.trim()+' ':'';
    r.onresult=e=>{let t='';for(let i=0;i<e.results.length;i++)t+=e.results[i][0].transcript;box.value=base+t;box.dispatchEvent(new Event('input'));};
    r.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'||e.error==='audio-capture'){STT.ok=false;lsSet('cre_stt_blocked',true);}STT.active=false;onDone&&onDone(e.error);};
    r.onend=()=>{STT.active=false;onDone&&onDone(null);};
    STT.rec=r;STT.active=true;r.start();return true;
  }catch(e){STT.ok=false;return false;}
}

    [k,title]=verdict(score);
    if(R.peeked&&k==='ok'){k='near';title='Bien, con el texto a la vista';}
    body=`<div>${diffHTML(al)}</div><div class="legendw"><span><span class="w ok">bien</span></span><span><span class="w near">casi</span></span><span><span class="w miss">faltó</span></span><span><span class="w sub"><s>dicho</s> esperado</span></span></div>
      <div class="cue en">${esc(sub(it.en))}</div><div class="es">${esc(sub(it.es))}</div>`;
    if(it.k==='produce'&&score>=0.4&&score<0.85&&aiOn()&&said){
      R.state='fb';R.fbHTML=`<div class="fb near">${thinkingHTML('Claude revisa si tu frase también es correcta')}</div>`;renderRun(false);
      try{
        const j=await aiJSON(`An English learner (Spanish speaker) was asked to say in English: "${sub(it.es)}". The reference answer is: "${sub(it.en)}". The learner said (speech-to-text transcript, ignore punctuation and capitalization): "${said}".\nIs the learner's sentence a correct and natural way to say it in American English, with the same meaning? Reply with only JSON: {"ok": true or false, "better": "a natural correct version close to what the learner said", "why_es": "one short sentence in Spanish"}`,'quick');
        if(j&&j.ok===true){k='ok';title='Bien: otra forma correcta';score=Math.max(score,0.86);}
        body+=`<div class="fix">${j&&j.ok?'<b>Tu versión es válida.</b> ':''}${esc(j&&j.why_es||'')}${j&&j.better?`<br><b>${esc(j.better)}</b>`:''}</div>`;
      }catch(e){const t=aiErr(e);if(t)body+=`<p class="small">${esc(t)}</p>`;}
    }
  }else{
    const toks=norm(said),tg=it.tg.toLowerCase(),ot=(it.ot||'').toLowerCase();
    const hasT=toks.includes(tg),hasO=ot&&toks.includes(ot);
    score=hasT&&!hasO?1:0;k=score?'ok':'bad';
    title=score?'Bien':'Otra vez';
    const heard=said?`El dictado escribió: «${esc(said)}».`:'No hubo respuesta.';
    if(it.k==='pairL')body=`<p>${heard} La palabra era <b>${esc(it.tg)}</b>.</p><p class="es">${hasO?'Escuchaste o pronunciaste la otra palabra del par. Escucha las dos varias veces y fíjate en la diferencia.':''}</p>`;
    else body=`<p>${heard} ${score?'Se entendió la palabra correcta.':'Se esperaba <b>'+esc(it.tg)+'</b>.'}</p>${!score?`<p class="es">${esc((PAIRS.find(p=>p.id===it.pid)||{}).es||'')}</p>`:''}`;
    if(it.k==='pairL'||it.k==='pairS'){const pr=it.k==='pairL'?[it.tg,it.ot]:[it.a,it.b];body+=`<div class="row"><button class="btn radio" type="button" data-say="${esc(pr[0])}">${esc(pr[0])}</button><button class="btn radio" type="button" data-say="${esc(pr[1])}">${esc(pr[1])}</button></div>`;}
    const ps=ST.pairs[it.pid]||{n:0,ok:0};ps.n++;if(score)ps.ok++;ST.pairs[it.pid]=ps;save();
  }
  if(R.tries===0){
    R.res.push({it,score,said});
    if(it.cid)srsUpdate(it.cid,score>=0.85||(k==='ok'));
  }
  R.state='fb';
  R.fbHTML=`<div class="fb ${k}"><h3>${esc(title)}${it.k==='repeat'||it.k==='produce'?' · '+fmt(100*score)+' %':''}</h3>${body}
    <div class="row">${it.k==='repeat'||it.k==='produce'?`<button class="btn radio" type="button" id="fbPlay">${ICON.play}Escuchar</button>`:''}${k!=='ok'?'<button class="btn" type="button" id="rRetry">Intentar otra vez</button>':''}<button class="btn primary" type="button" id="rNext">${R.i+1<R.items.length?'Siguiente':'Terminar'}</button></div></div>`;
  renderRun(false);
  document.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>speak(b.dataset.say,{rate:0.85}));
}
function renderRunEnd(m){
  const ok=R.res.filter(r=>r.score>=0.85).length,n=R.res.length;
  const miss=R.res.filter(r=>r.score<0.85&&r.it.en);
  m.innerHTML=`<div class="stack"><span class="eyebrow">${esc(R.title)}</span><h1>${n?fmt(100*ok/n)+' % bien':'Sin intentos'}</h1>
  <p class="lead">${ok} de ${n} transmisiones entendidas a la primera.${miss.length?' Estas vuelven en tu repaso:':''}</p>
  ${miss.length?'<div class="plist">'+miss.map((r,i)=>`<div class="pitem"><button class="icon" type="button" data-p="${i}" aria-label="Escuchar">${ICON.play}</button><div><div class="en">${esc(sub(r.it.en))}</div><div class="es">${esc(sub(r.it.es||''))}</div></div><span class="box">${fmt(100*r.score)} %</span></div>`).join('')+'</div>':''}
  <button class="btn primary wide" type="button" id="endOk">Continuar</button></div>`;
  m.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>speak(miss[+b.dataset.p].it.en));
  $('#endOk').onclick=()=>{const f=R.onDone;if(n&&f)f();else go('hoy');};
  hdr();
}

/* ====================== EVALUACIÓN (común) ====================== */
const RUBRIC=`Scores from 0 to 5, where 3 means the learner meets the target CEFR descriptor, 4 is above it and 2 is below it.`;
function evalPromptSpeaking(taskEn,transcript,secs,lv,extra){
  return `You are an expert CEFR speaking examiner for American English.\n${PROFILE}\nTarget level: ${lv}.\nTask: ${taskEn}\n${extra||''}The learner answered by speaking for about ${secs} seconds (approximate). This is the speech-to-text transcript; ignore punctuation and capitalization, and do not blame the learner for obvious recognition slips:\n"""${transcript}"""\nJudge fluency from the transcript only (length and connectedness of the answer, self-repairs). ${RUBRIC}\nReply with only this JSON:\n{"cefr":"A0|A1|A2|B1|B2|C1|C2","range":0,"accuracy":0,"fluency":0,"coherence":0,"task":0,"fixes":[{"said":"exact words from the transcript","better":"corrected version","why_es":"short reason in Spanish"}],"upgrade":"the learner's answer rewritten one CEFR level higher, same ideas, natural American English, at most 110 words","phrases":[{"en":"useful phrase for this task","es":"Spanish translation"}],"summary_es":"two sentences in Spanish: what was good and the single most important thing to improve"}\nAt most 4 fixes and exactly 3 phrases.`;
}
function num(x){const n=Number(x);return isFinite(n)?clamp(n,0,5):0;}
function evalHTML(j,opts){
  opts=opts||{};
  const keys=opts.keys||[['range','Vocabulario'],['accuracy','Gramática'],['fluency','Fluidez'],['coherence','Coherencia'],['task','Tarea']];
  const avg=keys.reduce((a,[k])=>a+num(j[k]),0)/keys.length;
  const fixes=Array.isArray(j.fixes)?j.fixes.slice(0,5):[],ph=Array.isArray(j.phrases)?j.phrases.slice(0,4):[];
  return `<div class="card stack"><div class="row" style="justify-content:space-between"><div><span class="eyebrow">Evaluación de Claude</span><div class="big">${esc(String(j.cefr||'—'))}</div></div><span class="chip ${avg>=3?'ok':avg>=2?'warn':'bad'}">${fmt(avg,1)} / 5</span></div>
  <div class="scores">${keys.map(([k,l])=>`<div><b>${fmt(num(j[k]),0)}</b><span>${l}</span></div>`).join('')}</div>
  ${j.summary_es?`<p>${esc(j.summary_es)}</p>`:''}
  ${fixes.length?'<h3>Correcciones</h3>'+fixes.map(f=>`<div class="fix"><s>${esc(f.said||'')}</s> → <b>${esc(f.better||'')}</b>${f.why_es?`<br><span class="small">${esc(f.why_es)}</span>`:''}</div>`).join(''):''}
  ${j.upgrade?`<h3>Tu respuesta, un nivel más arriba</h3><div class="incoming"><div class="play"><button class="playbtn" type="button" id="upPlay" aria-label="Escuchar">${ICON.play}</button>${waveHTML()}</div><div class="cue en" style="font-size:17px">${esc(j.upgrade)}</div><button class="btn radio" type="button" id="upShadow">Repetirla frase por frase</button></div>`:''}
  ${ph.length?'<h3>Frases para tu repaso</h3>'+ph.map((p,i)=>`<div class="phr"><div><b>${esc(p.en||'')}</b><div class="es">${esc(p.es||'')}</div></div><button class="btn" type="button" data-add="${i}">Agregar</button></div>`).join(''):''}
  </div>`;
}
function wireEval(j,lv,uid,back){
  const up=$('#upPlay');if(up)up.onclick=()=>speak(j.upgrade);
  const sh=$('#upShadow');if(sh)sh.onclick=()=>{const ss=splitSent(j.upgrade).map(s=>s.trim()).filter(s=>s.split(' ').length>=3).slice(0,8);runPractice(ss.map(s=>({k:'repeat',en:s,es:''})),{title:'Versión mejorada',onDone:back});};
  document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{const p=j.phrases[+b.dataset.add];if(!p||!p.en)return;addCustom(p.en,p.es||'',lv,uid);b.textContent='Agregada';b.disabled=true;});
}
function addCustom(en,es,lv,uid){
  const id='x'+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36);
  ST.custom[id]={en:String(en).slice(0,240),es:String(es).slice(0,240),lv:lv||null,u:uid||null,at:Date.now()};
  ST.srs[id]={b:0,due:Date.now(),n:1,l:0};save();
}
function pushEval(type,lv,j,uid){
  ST.evals.push({at:Date.now(),type,lv,u:uid||null,cefr:String(j.cefr||''),range:num(j.range),accuracy:num(j.accuracy),fluency:num(j.fluency),coherence:num(j.coherence),task:num(j.task!=null?j.task:j.interaction)});
  ST.evals=ST.evals.slice(-60);save();
}
function avgOf(j,keys){return keys.reduce((a,k)=>a+num(j[k]),0)/keys.length;}

    $('#tSend').disabled=true;$('#tOut').innerHTML=`<div class="card">${thinkingHTML('Claude evalúa tu respuesta')}</div>`;

      wireEval(j,u.lv,u.id,()=>go('tarea',p));
      $('#tAgain').onclick=()=>go('tarea',p);$('#tDone').onclick=()=>back();
    }catch(e){$('#tOut').innerHTML=`<div class="fb bad">${esc(aiErr(e)||'Consulta cancelada.')}</div>`;}
    $('#tSend').disabled=false;
  };
};

/* ====================== ESCUCHA ACTIVA ====================== */
const STYLE={A1:'Use very short sentences, the present simple, high-frequency words, numbers, times and plant equipment names. No idioms.',
 A2:'Use short sentences, the past simple and going to, everyday and plant vocabulary, and simple linking words (and, but, because, then).',
 B1:'Use connected speech with common linking words, some phrasal verbs, a clear problem and solution, and simple opinions.',
 B2:'Use natural speed and varied grammar (conditionals, passive, reported speech), technical vocabulary, some fillers (well, you know) and at least one difference of opinion.',
 C1:'Use fully natural American speech: fillers, false starts, idioms, phrasal verbs, implied meaning, understatement or irony, and dense technical detail. At least one important point must be implied rather than stated.'};
const QSTYLE={A1:'Ask about explicit facts (who, what, where, when, how many).',A2:'Ask about explicit facts and the order of events.',B1:'Mix facts and reasons (why).',
 B2:'Include at least one question about a speaker\'s opinion or attitude.',C1:'Include questions about implied meaning, attitude and the speaker\'s purpose, not only facts.'};
const KINDS=['a radio call between two people','a shift handover conversation between two coworkers','a voicemail message','a short conversation in a meeting','a short talk by an engineer to the team','a conversation between two coworkers during a break'];
function listenPrompt(u,lv,nq,exam){
  const L=LEVELS[LV_IDX[lv]],kind=exam?pick(['a conversation between two coworkers','a short talk by an engineer','a discussion in a meeting']):KINDS[(UNITS.indexOf(u)+((ST.units[u.id]||{}).ls||0))%KINDS.length];
  return `You write listening practice material for an English course.\n${PROFILE}\nCEFR level of this listening text: ${lv}${exam?' (this is a level test: make it a fair, typical '+lv+' listening task)':''}.\nTopic and situation: "${u.en}". ${u.ctx}\nWrite ${kind} in natural American English, about ${L.words} words in total. ${STYLE[lv]}\nThen write ${nq} questions in English that can be answered aloud in one or two sentences. ${QSTYLE[lv]}\nReply with only this JSON:\n{"title":"short title","speakers":["first name","first name"],"lines":[{"s":0,"t":"..."},{"s":1,"t":"..."}],"questions":[{"q":"question","q_es":"Spanish translation of the question","answer":"short model answer"}],"vocab":[{"en":"word or phrase","es":"Spanish translation"}]}\nRules: "s" is the speaker index; for a monologue use only 0 and split it into turns of one to three sentences. Write numbers as words. Give 4 to 6 vocab items.`;
}
function gradeListenPrompt(text,qs,answers,lv){
  return `Grade a listening comprehension quiz for an English learner (CEFR ${lv}). The learner answered by speaking: answers are speech-to-text transcripts, so ignore punctuation, capitalization, grammar and small recognition errors, and judge only whether the meaning shows the learner understood.\nListening text:\n"""${text}"""\nQuestions, model answers and the learner's answers:\n${qs.map((q,i)=>`${i+1}. Q: ${q.q} | Model: ${q.answer} | Learner: "${answers[i]||''}"`).join('\n')}\nReply with only this JSON:\n{"items":[{"score":0.0,"fb_es":"one short sentence in Spanish","better":"a natural, correct way to say the answer in English"}],"tip_es":"one practical listening tip in Spanish"}\nscore is from 0 (wrong or empty) to 1 (fully correct); one item per question, in order.`;
}
function validPassage(j){return j&&Array.isArray(j.lines)&&j.lines.length&&Array.isArray(j.questions)&&j.questions.length;}
SCREENS.escucha=(m,p)=>{
  const u=unitOf(p.u),lv=p.lv||u.lv,back=p.onDone||(()=>go('unidad',{u:u.id}));
  const S={j:null,show:false,ctl:null};
  const shell=inner=>{m.innerHTML=`<div class="stack"><div class="runhead"><div><span class="eyebrow">${lv} · escucha activa</span><h2>${esc(u.en)}</h2></div><button class="btn ghost" type="button" id="lBack">${ICON.back}Salir</button></div>${inner}</div>`;
    $('#lBack').onclick=()=>{if(S.ctl)S.ctl.abort();hush();back();};};
  if(!aiOn()){shell(needAI()+`<button class="btn primary" type="button" id="lChain">Hacer la cadena de escucha sin Claude</button>`);$('#lChain').onclick=()=>runPractice(chainItems(u),{title:'Cadena de escucha',onDone:back});return;}
  const gen=async()=>{
    shell(`<div class="card stack">${thinkingHTML('Claude prepara un audio nuevo de nivel '+lv)}<p class="small">Suele tardar entre 5 y 40 segundos.</p><button class="btn" type="button" id="lStop">Cancelar</button></div>`);
    S.ctl=new AbortController();$('#lStop').onclick=()=>S.ctl.abort();
    try{
      const j=await aiJSON(listenPrompt(u,lv,lv==='A1'?3:lv==='A2'?4:5,false),LV_IDX[lv]>=3?'default':'quick',{signal:S.ctl.signal,cache:false});
      if(!validPassage(j))throw {code:'invalid_json'};
      S.j=j;draw();
    }catch(e){const t=aiErr(e);shell(`<div class="fb bad">${esc(t||'Cancelado.')}</div><button class="btn primary" type="button" id="lRetry">Intentar otra vez</button>`);$('#lRetry').onclick=gen;}
  };
  const lines=()=>S.j.lines.map(l=>({t:String(l.t||''),v:(+l.s===1)?'B':'A'}));
  const fullText=()=>S.j.lines.map(l=>(S.j.speakers&&S.j.speakers[+l.s||0]?S.j.speakers[+l.s||0]+': ':'')+l.t).join('\n');
  const low=LV_IDX[lv]<=1;
  const draw=()=>{
    const j=S.j;
    shell(`<div class="incoming"><span class="eyebrow">Transmisión entrante · ${esc(j.title||'')}</span>
      <div class="play"><button class="playbtn" type="button" id="lPlay" aria-label="Escuchar">${ICON.play}</button>${waveHTML()}<button class="btn ghost" type="button" id="lSlow">Más lento</button></div>
      ${low&&Array.isArray(j.vocab)?`<div class="es">Palabras clave: ${j.vocab.map(v=>`<b>${esc(v.en)}</b> (${esc(v.es)})`).join(', ')}</div>`:''}
      <button class="link" type="button" id="lShow">${S.show?'Ocultar la transcripción':'Ver la transcripción (mejor después de escuchar dos veces)'}</button>
      ${S.show?`<div class="small" style="white-space:pre-line;font-size:15px;color:var(--ink)">${esc(fullText())}</div>`:''}</div>
      <p class="lead">Escucha las veces que necesites. Luego responde cada pregunta hablando.</p>
      ${j.questions.map((q,i)=>`<div class="card stack"><div class="row"><button class="icon" type="button" data-q="${i}" aria-label="Escuchar la pregunta">${ICON.play}</button><b style="flex:1;min-width:0">${i+1}. ${esc(q.q)}</b></div>${low&&q.q_es?`<div class="es">${esc(q.q_es)}</div>`:''}${txHTML('q'+i,'Responde hablando')}</div>`).join('')}
      <button class="btn primary wide" type="button" id="lSend">Enviar respuestas</button><div id="lOut"></div>`);
    $('#lPlay').onclick=()=>speakLines(lines());
    $('#lSlow').onclick=()=>speakLines(lines(),{slow:true});
    $('#lShow').onclick=()=>{S.show=!S.show;S.peeked=true;draw();};
    m.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>speak(j.questions[+b.dataset.q].q));
    const txs=j.questions.map((q,i)=>wireTx('q'+i));
    $('#lSend').onclick=async()=>{
      const ans=txs.map(t=>t?t.box.value.trim():'');
      ans.forEach(a=>{if(a)noteSpoke(a);});
      $('#lSend').disabled=true;$('#lOut').innerHTML=`<div class="card">${thinkingHTML('Claude revisa tus respuestas')}</div>`;
      try{
        const g=await aiJSON(gradeListenPrompt(S.j.lines.map(l=>l.t).join(' '),j.questions,ans,lv),'quick');
        const items=(g&&Array.isArray(g.items)?g.items:[]);
        const sc=j.questions.map((q,i)=>clamp(Number((items[i]||{}).score)||0,0,1));
        const pct=sc.reduce((a,b)=>a+b,0)/sc.length;
        if(pct>=0.7&&!S.peeked){const r=ST.units[u.id]||(ST.units[u.id]={});r.ls=(r.ls||0)+1;save();}
        $('#lOut').innerHTML=`<div class="fb ${pct>=0.7?'ok':pct>=0.5?'near':'bad'}"><h3>${fmt(100*pct)} % de comprensión</h3>${S.peeked&&pct>=0.7?'<p class="small">Viste la transcripción antes de responder: no cuenta para el dominio de la unidad.</p>':''}
          ${j.questions.map((q,i)=>`<div class="fix"><b>${i+1}. ${fmt(100*sc[i])} %</b> ${esc((items[i]||{}).fb_es||'')}<br><span class="small">Modelo: ${esc((items[i]||{}).better||q.answer)}</span></div>`).join('')}
          ${g&&g.tip_es?`<p>${esc(g.tip_es)}</p>`:''}</div>
          ${Array.isArray(j.vocab)?'<div class="card"><h3>Vocabulario del audio</h3>'+j.vocab.map((v,i)=>`<div class="phr"><div><b>${esc(v.en)}</b><div class="es">${esc(v.es)}</div></div><button class="btn" type="button" data-v="${i}">Agregar</button></div>`).join('')+'</div>':''}
          <div class="row"><button class="btn radio" type="button" id="lShadow">Repetir el audio frase por frase</button><button class="btn" type="button" id="lNew">Otro audio</button><button class="btn primary" type="button" id="lDone">Listo</button></div>`;
        m.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{const v=j.vocab[+b.dataset.v];addCustom(v.en,v.es,lv,u.id);b.textContent='Agregada';b.disabled=true;});
        $('#lShadow').onclick=()=>runPractice(S.j.lines.flatMap(l=>splitSent(l.t)).map(s=>s.trim()).filter(s=>s.split(' ').length>=3).slice(0,10).map(s=>({k:'repeat',en:s,es:''})),{title:'Sombra del audio',onDone:back});
        $('#lNew').onclick=()=>{S.show=false;S.peeked=false;gen();};
        $('#lDone').onclick=()=>back();
      }catch(e){$('#lOut').innerHTML=`<div class="fb bad">${esc(aiErr(e)||'Cancelado.')}</div>`;$('#lSend').disabled=false;}
    };
  };
  gen();
};

SCREENS.hablar=(m)=>{
  const u=workUnit();
  m.innerHTML=`<div class="stack"><div><h1>Conversar</h1><p class="lead">Claude hace de supervisor, colega o entrevistador estadounidense. Tú escuchas su voz y respondes hablando. Al final te evalúa con los descriptores del MCER.</p></div>
  ${aiOn()?'':needAI()}
  <button class="btn primary wide" type="button" data-c="${u.id}">Role-play de tu unidad: ${esc(u.en)}</button>
  <div class="card stack"><h3>Charla libre</h3><p class="lead" style="margin:0">Un colega estadounidense conversa contigo de lo que quieras: tu trabajo, tu país, tus planes de viaje.</p>
    <div class="row">${LEVELS.map(l=>`<button class="btn" type="button" data-f="${l.id}">${l.id}</button>`).join('')}</div></div>
  ${LEVELS.map(l=>`<div class="card stack"><h3>${l.id} · situaciones</h3><div class="units">${UNITS.filter(x=>x.lv===l.id).map(x=>`<button type="button" data-c="${x.id}"><b>${esc(x.en)}</b><small>${esc(x.role)}</small></button>`).join('')}</div></div>`).join('')}</div>`;

function chatRules(u,lv,free){
  const L=LEVELS[LV_IDX[lv]];
  const scen=free?'A relaxed conversation between two coworkers at a copper mine in Arizona. Talk about whatever the learner wants: work, Peru, life in the US, plans, opinions.':u.ctx;
  const role=free?'Sam, a friendly American coworker who asks good follow-up questions':u.role;
  const me=free?'a Peruvian metallurgical engineer':u.me;
  return `Let's do a spoken role-play so I can practice American English. Stay in character for the whole conversation.\nScenario: ${scen}\nYour role: ${role}. My role: ${me}.\nMy CEFR level: ${lv}. ${L.talk}\nRules:\n- Reply ONLY with your next spoken line: no stage directions, no translations, no lists, no emojis, no notes about my English.\n- Keep each reply under ${L.maxw} words and usually end with a question or a prompt that makes me speak.\n- My messages are speech-to-text transcripts: ignore punctuation, capitalization and small recognition errors.\n- If an error of mine blocks meaning, naturally rephrase what I said correctly inside your reply and continue.\n- If I write in Spanish, answer in simple English and help me say it in English.\n${free?'':'- Steer the conversation toward this goal for me: '+u.goal+' (the goal is in Spanish; keep speaking English).\n'}Start now with your first line.`;
}
SCREENS.chat=(m,p)=>{
  const free=p.free||null,u=free?workUnit():unitOf(p.u),lv=free||u.lv,back=p.onDone||(()=>go('hablar'));
  const C={rules:chatRules(u,lv,free),turns:[],busy:false,ctl:null,show:{},tr:{},ended:false};
  UI.leave=()=>{if(C.ctl)C.ctl.abort();};
  const maxT=TURNS[lv];
  const mine=()=>C.turns.filter(t=>t.role==='user').length;
  const draw=(focus)=>{
    m.innerHTML=`<div class="stack"><div class="runhead"><div><span class="eyebrow">${lv} · ${free?'charla libre':'role-play'}</span><h2>${esc(free?'Charla con Sam':u.en)}</h2></div><button class="btn ghost" type="button" id="cBack">${ICON.back}Salir</button></div>
    <p class="small" style="margin:0">${free?'Habla de lo que quieras.':'Tu papel: <i>'+esc(u.me)+'</i>. Objetivo: '+esc(u.goal)}</p>
    ${aiOn()?'':needAI()}
    <div class="chat" id="chatList">${C.turns.map((t,i)=>t.role==='assistant'?`<div class="msg them"><span class="eyebrow" style="color:var(--radio)">Entrante</span>
      <div class="${ST.listenFirst&&!C.show[i]?'hidden-text':''}">${esc(t.content)}</div>${C.tr[i]?`<div class="es">${esc(C.tr[i])}</div>`:''}
      <div class="meta"><button class="icon" type="button" data-pl="${i}" aria-label="Escuchar">${ICON.play}</button>${ST.listenFirst&&!C.show[i]?`<button class="link" type="button" data-sh="${i}">Ver texto</button>`:''}${C.tr[i]?'':`<button class="link" type="button" data-tr="${i}">¿Qué dijo?</button>`}</div></div>`:`<div class="msg me">${esc(t.content)}</div>`).join('')}
      ${C.busy?`<div class="msg them">${thinkingHTML(C.turns.length?'Escribiendo':'Preparando la conversación')}</div>`:''}</div>
    ${C.err?`<div class="fb bad">${esc(C.err)}</div>`:''}
    ${C.ended?'':(C.turns.length&&!C.busy?txHTML('cAns','Toca aquí y responde hablando')+`<div class="row"><button class="btn primary" type="button" id="cSend">Transmitir</button><span class="small">${mine()} de ${maxT} turnos</span><button class="btn" type="button" id="cEnd"${mine()<3?' disabled':''}>Terminar y evaluar</button></div>`:'')}
    ${!C.turns.length&&!C.busy&&aiOn()?'<button class="btn primary wide" type="button" id="cStart">Empezar la conversación</button>':''}
    <div id="cOut"></div></div>`;
    $('#cBack').onclick=()=>{if(C.ctl)C.ctl.abort();hush();back();};
    m.querySelectorAll('[data-pl]').forEach(b=>b.onclick=()=>speak(C.turns[+b.dataset.pl].content));
    m.querySelectorAll('[data-sh]').forEach(b=>b.onclick=()=>{C.show[+b.dataset.sh]=true;draw();});
    m.querySelectorAll('[data-tr]').forEach(b=>b.onclick=async()=>{const i=+b.dataset.tr;b.textContent='Traduciendo…';b.disabled=true;
      try{const r=await AI.fn('Translate into natural Latin American Spanish. Reply with only the translation:\n\n'+C.turns[i].content,{modelTier:'quick'});C.tr[i]=r.text.trim();C.show[i]=true;}catch(e){C.err=aiErr(e);}draw();});
    const st=$('#cStart');if(st)st.onclick=()=>ask();
    if(!C.ended&&C.turns.length&&!C.busy){
      const tx=wireTx('cAns');
      if(focus&&tx)setTimeout(()=>{try{tx.box.focus({preventScroll:true});}catch(e){}},50);
      $('#cSend').onclick=()=>{const v=tx.box.value.trim();if(!v){tx.box.focus();return;}noteSpoke(v);C.turns.push({role:'user',content:v,secs:tx.secs()});
        if(mine()>=maxT){draw();evaluate();}else ask();};
      $('#cEnd').onclick=()=>evaluate();
    }
    const list=$('#chatList');if(list&&list.lastElementChild&&C.turns.length>1)list.lastElementChild.scrollIntoView({block:'nearest'});
  };
  const ask=async()=>{
    C.busy=true;C.err='';draw();
    C.ctl=new AbortController();
    const msgs=[{role:'user',content:C.rules},...C.turns.map(t=>({role:t.role,content:t.content}))];
    if(msgs[msgs.length-1].role!=='user')msgs.push({role:'user',content:'(continue)'});
    try{
      const r=await AI.fn(msgs.slice(0,1).concat(msgs.slice(1).slice(-24)),{modelTier:'quick',cache:false,signal:C.ctl.signal});
      const line=r.text.trim().replace(/^["“]|["”]$/g,'');
      C.turns.push({role:'assistant',content:line});C.busy=false;draw(true);
      speak(line);
    }catch(e){C.busy=false;C.err=aiErr(e);draw();}
  };
  const evaluate=async()=>{
    C.ended=true;draw();
    $('#cOut').innerHTML=`<div class="card">${thinkingHTML('Claude evalúa la conversación')}</div>`;
    const transcript=C.turns.map(t=>(t.role==='assistant'?'PARTNER: ':'LEARNER: ')+t.content).join('\n');
    const secs=C.turns.reduce((a,t)=>a+(t.secs||0),0);
    const prompt=`You are an expert CEFR speaking examiner for American English.\n${PROFILE}\nTarget level: ${lv}.\nRole-play scenario: ${free?'free conversation with a coworker':u.ctx} The learner's goal: ${free?'keep a natural conversation':u.goal}\nTranscript (the learner's lines are speech-to-text transcripts; ignore punctuation and capitalization, and do not blame the learner for obvious recognition slips; the learner spoke for about ${secs} seconds in total):\n"""\n${transcript}\n"""\nAssess only the LEARNER. Judge fluency from the transcript (length and connectedness of turns). ${RUBRIC}\nReply with only this JSON:\n{"cefr":"A0|A1|A2|B1|B2|C1|C2","range":0,"accuracy":0,"fluency":0,"coherence":0,"interaction":0,"fixes":[{"said":"exact learner words","better":"corrected version","why_es":"short reason in Spanish"}],"upgrade":"the learner's best turn rewritten one CEFR level higher, natural American English, at most 80 words","phrases":[{"en":"useful phrase for this situation","es":"Spanish translation"}],"summary_es":"two sentences in Spanish: what was good and the single most important thing to improve"}\nAt most 5 fixes and exactly 3 phrases.`;
    try{
      const j=await aiJSON(prompt,'default');
      const keys=['range','accuracy','fluency','coherence','interaction'];
      const avg=avgOf(j,keys);
      if(!free){const r=ST.units[u.id]||(ST.units[u.id]={});r.rp=Math.max(r.rp||0,avg);}
      pushEval(free?'charla':'roleplay',lv,j,free?null:u.id);
      $('#cOut').innerHTML=evalHTML(j,{keys:[['range','Vocabulario'],['accuracy','Gramática'],['fluency','Fluidez'],['coherence','Coherencia'],['interaction','Interacción']]})+`<div class="row"><button class="btn" type="button" id="cAgain">Otra conversación</button><button class="btn primary" type="button" id="cDone">Listo</button></div>`;
      wireEval(j,lv,free?null:u.id,()=>go('chat',p));
      $('#cAgain').onclick=()=>go('chat',p);$('#cDone').onclick=()=>back();
    }catch(e){$('#cOut').innerHTML=`<div class="fb bad">${esc(aiErr(e)||'Cancelado.')}</div><button class="btn" type="button" id="cRe">Intentar evaluar otra vez</button>`;$('#cRe').onclick=()=>evaluate();}
  };
  draw();
};

SCREENS.examen=(m,p)=>{
  const lv=p.lv,L=LEVELS[LV_IDX[lv]],u=UNITS.filter(x=>x.lv===lv)[Math.floor(Math.random()*6)];
  const X={step:'intro',lis:null,ans:[],lisScore:0,spk:[],ctl:null};
  UI.leave=()=>{if(X.ctl)X.ctl.abort();};
  const hist=(ST.exams[lv]||[]).slice(-3).reverse();
  const shell=inner=>{m.innerHTML=`<div class="stack"><div class="runhead"><div><span class="eyebrow">Examen de nivel</span><h2>${lv} · ${esc(L.name)}</h2></div><button class="btn ghost" type="button" id="xBack">${ICON.back}Salir</button></div>${inner}</div>`;$('#xBack').onclick=()=>{if(X.ctl)X.ctl.abort();hush();go('ruta');};};
  const intro=()=>{shell(`<div class="card stack"><p>${esc(L.can)}</p><ol><li><b>Escucha:</b> un audio nuevo de nivel ${lv} con 5 preguntas que respondes hablando.</li><li><b>Habla:</b> tres tareas (entrevista, turno largo y ${esc(EXAM[lv][2].k.toLowerCase())}). Habla al menos ${SECS[lv]} segundos en el turno largo.</li></ol>
    <p class="small">Apruebas con 70 % o más en escucha, nivel ${lv} o superior en habla y 3 de 5 de promedio en los criterios. Toma unos 15 minutos. No mires la transcripción.</p>
    ${hist.length?'<p class="small">Intentos anteriores: '+hist.map(h=>`${new Date(h.at).toLocaleDateString('es-PE')} · escucha ${fmt(100*h.lis)} % · habla ${esc(h.cefr)} ${h.pass?'(aprobado)':''}`).join(' · ')+'</p>':''}
    ${aiOn()?'<button class="btn primary" type="button" id="xGo">Empezar el examen</button>':needAI()}</div>`);const g=$('#xGo');if(g)g.onclick=lis;};
  const lis=async()=>{
    shell(`<div class="card stack">${thinkingHTML('Claude prepara la parte de escucha')}<button class="btn" type="button" id="xStop">Cancelar</button></div>`);
    X.ctl=new AbortController();$('#xStop').onclick=()=>X.ctl.abort();

    catch(e){shell(`<div class="fb bad">${esc(aiErr(e)||'Cancelado.')}</div><button class="btn primary" type="button" id="xR">Intentar otra vez</button>`);$('#xR').onclick=lis;}
  };
  const drawLis=()=>{
    const j=X.lis;
    shell(`<span class="eyebrow">Parte 1 de 2 · escucha</span><div class="incoming"><div class="play"><button class="playbtn" type="button" id="xPlay" aria-label="Escuchar">${ICON.play}</button>${waveHTML()}</div><p class="es" style="margin:0">Puedes escucharlo dos veces.</p></div>
    ${j.questions.slice(0,5).map((q,i)=>`<div class="card stack"><div class="row"><button class="icon" type="button" data-q="${i}" aria-label="Escuchar la pregunta">${ICON.play}</button><b style="flex:1;min-width:0">${i+1}. ${esc(q.q)}</b></div>${txHTML('xq'+i,'Responde hablando')}</div>`).join('')}
    <button class="btn primary wide" type="button" id="xNext">Pasar a la parte de habla</button>`);
    let plays=0;const lines=j.lines.map(l=>({t:String(l.t||''),v:+l.s===1?'B':'A'}));

    m.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>speak(j.questions[+b.dataset.q].q));
    const txs=j.questions.slice(0,5).map((q,i)=>wireTx('xq'+i));
    $('#xNext').onclick=()=>{X.ans=txs.map(t=>t?t.box.value.trim():'');X.ans.forEach(a=>{if(a)noteSpoke(a);});X.k=0;spk();};
