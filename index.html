    ${txHTML('xs','Responde hablando',true)}<button class="btn primary wide" type="button" id="xN2">${X.k<2?'Siguiente tarea':'Terminar y evaluar'}</button>`);
    $('#xP2').onclick=()=>speak(t.en);speak(t.en);
    const tx=wireTx('xs');
    $('#xN2').onclick=()=>{const v=tx.box.value.trim();if(!v){tx.box.focus();return;}noteSpoke(v);X.spk[X.k]={t,said:v,secs:tx.secs()};X.k++;if(X.k<3)spk();else grade();};
  };
  const grade=async()=>{
    shell(`<div class="card stack">${thinkingHTML('Claude evalúa tu examen')}<p class="small">Puede tardar hasta un minuto.</p></div>`);
    try{
      const [g1,g2]=await Promise.all([
        aiJSON(gradeListenPrompt(X.lis.lines.map(l=>l.t).join(' '),X.lis.questions.slice(0,5),X.ans,lv),'default'),
        aiJSON(`You are an expert CEFR speaking examiner for American English, running a ${lv} level test.\n${PROFILE}\nThe learner did three speaking tasks. Answers are speech-to-text transcripts: ignore punctuation and capitalization and obvious recognition slips; judge fluency from the transcript (length and connectedness).\n${X.spk.map((s,i)=>`Task ${i+1} (${s.t.k}): ${s.t.en}\nSpoke about ${s.secs} seconds. Transcript: """${s.said}"""`).join('\n\n')}\nGive ONE overall assessment across the three tasks. ${RUBRIC}\nReply with only this JSON:\n{"cefr":"A0|A1|A2|B1|B2|C1|C2","range":0,"accuracy":0,"fluency":0,"coherence":0,"task":0,"fixes":[{"said":"exact learner words","better":"corrected version","why_es":"short reason in Spanish"}],"phrases":[{"en":"useful phrase","es":"Spanish translation"}],"summary_es":"three sentences in Spanish: strengths, the main gap to reach ${lv} or the next level, and what to practice"}\nAt most 5 fixes and exactly 3 phrases.`,'default')
      ]);
      const items=g1&&Array.isArray(g1.items)?g1.items:[];
      const lisScore=X.lis.questions.slice(0,5).reduce((a,q,i)=>a+clamp(Number((items[i]||{}).score)||0,0,1),0)/Math.min(5,X.lis.questions.length);
      const avg=avgOf(g2,['range','accuracy','fluency','coherence','task']);
      const cefr=String(g2.cefr||'A0').toUpperCase();
      const pass=lisScore>=0.7&&(CEFR_RANK[cefr]||0)>=CEFR_RANK[lv]&&avg>=3;
      (ST.exams[lv]=ST.exams[lv]||[]).push({at:Date.now(),lis:lisScore,cefr,avg,pass});
      if(pass&&!ST.passed[lv])ST.passed[lv]={at:Date.now(),lis:lisScore,cefr,avg};
      pushEval('examen',lv,g2,null);save();
      shell(`<div class="fb ${pass?'ok':'bad'}"><h3>${pass?'Aprobaste el examen '+lv:'Todavía no: sigue con las unidades de '+lv}</h3><p>Escucha: <b>${fmt(100*lisScore)} %</b> · Habla: <b>${esc(cefr)}</b>, ${fmt(avg,1)} / 5.</p></div>
      <div class="card stack"><h3>Escucha</h3>${X.lis.questions.slice(0,5).map((q,i)=>`<div class="fix"><b>${i+1}. ${fmt(100*clamp(Number((items[i]||{}).score)||0,0,1))} %</b> ${esc(q.q)}<br><span class="small">${esc((items[i]||{}).fb_es||'')} Modelo: ${esc((items[i]||{}).better||q.answer)}</span></div>`).join('')}
      <details><summary class="small">Ver la transcripción del audio</summary><p class="small" style="white-space:pre-line">${esc(X.lis.lines.map(l=>l.t).join('\n'))}</p></details></div>
      ${evalHTML(g2)}<button class="btn primary wide" type="button" id="xDone">Volver a la ruta</button>`);
      wireEval(g2,lv,null,()=>go('ruta'));$('#xDone').onclick=()=>go('ruta');
    }catch(e){shell(`<div class="fb bad">${esc(aiErr(e)||'Cancelado.')}</div><button class="btn primary" type="button" id="xG">Intentar evaluar otra vez</button>`);$('#xG').onclick=grade;}
  };
  intro();
};

/* ====================== PROGRESO ====================== */
SCREENS.progreso=(m)=>{
  const days=[];for(let i=13;i>=0;i--){const d=new Date(Date.now()-i*DAY);const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');days.push({k,d,v:(ST.days[k]||{}).sec||0});}
  const mx=Math.max(1800,...days.map(d=>d.v));
  const tot=Object.values(ST.days).reduce((a,d)=>({spk:a.spk+(d.spk||0),w:a.w+(d.w||0),lis:a.lis+(d.lis||0)}),{spk:0,w:0,lis:0});
  const allIds=Object.keys(CHUNKS).concat(Object.keys(ST.custom));
  const mast=allIds.filter(id=>srsGet(id).b>=MASTER_BOX).length,seen=allIds.filter(id=>srsGet(id).n>0).length;
  const lv=currentLevel(),next=LEVELS[lv?Math.min(4,LV_IDX[lv]+1):0];
  const hrs=totalSec()/3600;
  const ev=ST.evals.slice(-8).reverse();
  m.innerHTML=`<div class="stack"><div><h1>Progreso</h1><p class="lead">Tu nivel sube solo cuando apruebas un examen de nivel. Las horas y las frases dominadas muestran si estás practicando lo suficiente para llegar.</p></div>
  <div class="card stack"><div class="row" style="justify-content:space-between;align-items:flex-end"><div><span class="eyebrow">Ruta a C1</span><div class="big">${fmt(100*routeMastery(),2)} %</div></div><div style="text-align:right"><span class="eyebrow">Nivel aprobado</span><div class="big">${lv||'A0'}</div></div></div>${trackHTML()}
    ${LEVELS.map(l=>`<div class="lvbar"><b>${l.id}</b><div class="meter"><span class="${levelMastery(l.id)>=0.999?'full':''}" style="width:${(100*levelMastery(l.id)).toFixed(1)}%"></span></div><output>${fmt(100*levelMastery(l.id),1)} %</output></div>`).join('')}</div>
  <div class="kpis"><div><b>${fmt(hrs,1)} h</b><span>activas en total</span></div><div><b>${fmt(tot.spk)}</b><span>transmisiones habladas</span></div><div><b>${fmt(tot.lis/60)} min</b><span>de escucha</span></div><div><b>${fmt(tot.w)}</b><span>palabras dichas</span></div><div><b>${mast}/${allIds.length}</b><span>frases dominadas</span></div><div><b>${streak()} d</b><span>racha (5 min o más al día)</span></div></div>
  <div class="card"><h3>Minutos por día, últimas 2 semanas</h3><div class="bars14">${days.map(d=>`<div title="${d.k}: ${fmt(d.v/60)} min"><span class="b" style="height:${(100*d.v/mx).toFixed(1)}%"></span><small>${d.d.getDate()}</small></div>`).join('')}</div>
    <p class="small" style="margin:8px 0 0">Referencia de Cambridge English: unas ${next.h} horas guiadas acumuladas para ${next.id}, y 700 a 800 para C1. Llevas ${fmt(hrs,1)} h en la app. A 1 hora diaria, de cero a C1 son unos dos años; con más horas y con inglés real fuera de la app, menos.</p></div>
  <div class="card stack"><h3>Últimas evaluaciones de Claude</h3>${ev.length?ev.map(e=>`<div class="phr"><div><b>${esc(e.cefr||'—')}</b> · ${esc({tarea:'Tarea de habla',roleplay:'Role-play',charla:'Charla libre',examen:'Examen'}[e.type]||e.type)} ${esc(e.lv)}<div class="es">${new Date(e.at).toLocaleDateString('es-PE')} · vocabulario ${fmt(e.range)} · gramática ${fmt(e.accuracy)} · fluidez ${fmt(e.fluency)} · coherencia ${fmt(e.coherence)}</div></div><span class="chip">${fmt((e.range+e.accuracy+e.fluency+e.coherence+e.task)/5,1)}</span></div>`).join(''):'<p class="lead">Aún no hay evaluaciones. Haz una tarea de habla o un role-play.</p>'}</div>
  <div class="card stack"><h3>Repaso</h3><p class="lead" style="margin:0">${seen} frases vistas · ${dueCards(999).length} para repasar hoy · ${Object.keys(ST.custom).length} agregada${Object.keys(ST.custom).length===1?'':'s'} desde tus evaluaciones y audios.</p></div>
  </div>`;
};

/* ====================== AJUSTES ====================== */
SCREENS.ajustes=(m)=>{
  const vs=TTS.voices;
  const opt=(sel)=>vs.map(v=>`<option value="${esc(v.name)}"${v.name===sel?' selected':''}>${esc(v.name)}</option>`).join('');
  const th=document.documentElement.getAttribute('data-theme')||'';
  m.innerHTML=`<div class="stack"><h1>Ajustes</h1>
  <div class="card stack"><label class="fld">Tu nombre (para las presentaciones)<input id="sName" value="${esc(ST.name)}" placeholder="Por ejemplo: David" autocomplete="given-name"></label></div>
  <div class="card stack"><h3>Voces en inglés americano</h3>
    ${vs.length?`<label class="fld">Voz principal<select id="sV1">${opt(voiceA()&&voiceA().name)}</select></label><label class="fld">Segunda voz (diálogos)<select id="sV2">${opt(voiceB()&&voiceB().name)}</select></label>`:'<p class="lead">Este dispositivo no muestra voces en inglés de Estados Unidos.</p>'}
    <label class="fld">Velocidad: <span id="sRateV">${fmt(ST.rate||1,2)}×</span> sobre la velocidad del nivel<input type="range" id="sRate" min="0.7" max="1.3" step="0.05" value="${ST.rate||1}"></label>
    <div class="row"><button class="btn radio" type="button" id="sTest">${ICON.play}Probar voces</button></div>
    <label class="toggle"><input type="checkbox" id="sLF"${ST.listenFirst?' checked':''}><span>Escuchar antes de leer: oculta el texto de lo que te dicen hasta que lo pidas.</span></label></div>
  <div class="card stack"><h3>Cómo hablar en la app</h3><div class="how"><div><b>Android</b>Micrófono del teclado (Gboard), con el idioma del teclado en inglés de EE. UU.</div><div><b>iPhone</b>Micrófono del teclado. Actívalo en Ajustes › General › Teclado › Dictado, y elige inglés (EE. UU.).</div><div><b>Windows</b>Windows + H dentro del recuadro.</div><div><b>Mac</b>Tecla de dictado o doble Fn.</div></div>
    <p class="small" style="margin:0">${STT.ok?'Este navegador también permite el botón «Hablar» dentro de la app.':'Dentro de claude.ai la página no puede usar el micrófono directamente; el dictado del teclado funciona igual.'}</p></div>
  <div class="card stack"><h3>Apariencia</h3><div class="row">${[['','Sistema'],['light','Claro'],['dark','Oscuro']].map(([v,l])=>`<button class="btn${th===v?' primary':''}" type="button" data-th="${v}">${l}</button>`).join('')}</div></div>
  <div class="card stack"><h3>Tu progreso</h3><p class="lead" style="margin:0" id="sync">${CLOUD.ref?'Guardado en tu cuenta: te sigue en el celular y en la computadora.':'Guardado en este navegador.'}</p>
    <button class="btn" type="button" id="sReset">Borrar todo mi progreso</button><div id="sConf"></div></div></div>`;
  $('#sName').oninput=e=>{ST.name=e.target.value.slice(0,30);save();};
  const v1=$('#sV1');if(v1)v1.onchange=e=>{ST.voice=e.target.value;save();};
  const v2=$('#sV2');if(v2)v2.onchange=e=>{ST.voice2=e.target.value;save();};
  $('#sRate').oninput=e=>{ST.rate=Number(e.target.value);$('#sRateV').textContent=fmt(ST.rate,2)+'×';save();};
  $('#sTest').onclick=()=>speakLines([{t:'Control room, this is flotation. Over.',v:'A'},{t:'Go ahead, flotation.',v:'B'}]);
  $('#sLF').onchange=e=>{ST.listenFirst=e.target.checked;save();};
  m.querySelectorAll('[data-th]').forEach(b=>b.onclick=()=>{const v=b.dataset.th;if(v)document.documentElement.setAttribute('data-theme',v);else document.documentElement.removeAttribute('data-theme');lsSet('cre_theme',v);render();});
  $('#sReset').onclick=()=>{$('#sConf').innerHTML=`<div class="confirm">Se borrarán frases, evaluaciones, exámenes y horas. <div class="row" style="margin-top:8px"><button class="btn primary" type="button" id="sYes">Sí, borrar</button><button class="btn" type="button" id="sNo">Cancelar</button></div></div>`;
    $('#sYes').onclick=()=>{const keep={name:ST.name,voice:ST.voice,voice2:ST.voice2,rate:ST.rate};ST=Object.assign(blankState(),keep);save(true);go('hoy');};
    $('#sNo').onclick=()=>{$('#sConf').innerHTML='';};};
};

/* El índice BANK_INDEX llega en e8_index.js: {g:{grupo:duración}, c:{id:[grupo,inicio,duración]}}.
   En la página publicada los audios son archivos audio/<grupo>.mp3; en la copia local van incrustados en BANK_DATA. */
const AC=window.AudioContext||window.webkitAudioContext||null;
const BANK={ctx:null,buf:{},loading:{},fail:{},txt:new Map(),cur:[],ok:!!AC&&typeof BANK_INDEX!=='undefined'};
function bankKey(t){return String(t||'').toLowerCase().replace(/[’']/g,'').replace(/[^a-z0-9]+/g,' ').trim();}
function bankOn(){return BANK.ok&&ST.hifi!==false;}
(function bankMap(){
  if(!BANK.ok)return;
  UNITS.forEach(u=>u.ch.forEach((c,i)=>{const id='c:'+u.id+'-'+i;if(BANK_INDEX.c[id])BANK.txt.set(bankKey(c[0]),'chunk:'+u.id+'-'+i);}));
  Object.keys(BANK_INDEX.c).forEach(id=>{if(id.startsWith('w:'))BANK.txt.set('w '+bankKey(id.slice(2)),id);});
  if(typeof PLANT!=='undefined')PLANT.forEach(a=>{if(BANK_INDEX.c['p:'+a.id+':n'])BANK.txt.set(bankKey(a.en),'p:'+a.id+':n');a.ph.forEach((p,i)=>{if(BANK_INDEX.c['p:'+a.id+':'+i])BANK.txt.set(bankKey(p[0]),'p:'+a.id+':'+i);});});
})();
function actx(){
  if(!AC)return null;
  if(!BANK.ctx){try{BANK.ctx=new AC();}catch(e){BANK.ok=false;return null;}try{if(navigator.audioSession)navigator.audioSession.type='playback';}catch(e){}}
  if(BANK.ctx.state==='suspended'){try{BANK.ctx.resume();}catch(e){}}
  return BANK.ctx;
}
document.addEventListener('pointerdown',()=>{if(BANK.ok)actx();},{passive:true});
function bankSrc(g){return (typeof BANK_DATA!=='undefined'&&BANK_DATA[g])?BANK_DATA[g]:'audio/'+g+'.mp3';}
function decodeBuf(ctx,ab){return new Promise((res,rej)=>{try{const p=ctx.decodeAudioData(ab,res,rej);if(p&&p.then)p.then(res,rej);}catch(e){rej(e);}});}
function bankLoad(g){
  if(BANK.buf[g])return Promise.resolve(BANK.buf[g]);
  if(BANK.loading[g])return BANK.loading[g];
  const ctx=actx();if(!ctx)return Promise.reject(new Error('no audio'));
  BANK.loading[g]=fetch(bankSrc(g)).then(r=>{if(!r.ok)throw new Error('http '+r.status);return r.arrayBuffer();}).then(ab=>decodeBuf(ctx,ab)).then(b=>{BANK.buf[g]=b;delete BANK.loading[g];return b;})
    .catch(e=>{delete BANK.loading[g];BANK.fail[g]=(BANK.fail[g]||0)+1;throw e;});
  return BANK.loading[g];
}
function bankHas(id){return BANK.ok&&!!BANK_INDEX.c[id]&&(BANK.fail[BANK_INDEX.c[id][0]]||0)<2;}
function bankPreload(prefix){if(!bankOn())return;const gs=new Set();Object.entries(BANK_INDEX.c).forEach(([id,c])=>{if(id.startsWith(prefix))gs.add(c[0]);});gs.forEach(g=>bankLoad(g).catch(()=>{}));}
function bankStop(){BANK.cur.forEach(n=>{try{n.stop();}catch(e){}try{n.disconnect();}catch(e){}});BANK.cur=[];}

function noiseBuf(ctx,sec){const n=Math.max(1,Math.floor(ctx.sampleRate*sec)),b=ctx.createBuffer(1,n,ctx.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;return b;}
function clipCurve(k){const n=1024,c=new Float32Array(n);for(let i=0;i<n;i++){const x=i*2/n-1;c[i]=Math.tanh(k*x)/Math.tanh(k);}return c;}
function radioBurst(ctx,t,dur,level,dest){
  const s=ctx.createBufferSource();s.buffer=noiseBuf(ctx,dur);const f=ctx.createBiquadFilter();f.type='bandpass';f.frequency.value=1800;f.Q.value=0.6;

/* reproduce un clip; opts.radio aplica filtro de radio, ruido y squelch; opts.garble agrega cortes */
function bankPlay(id,opts){
  opts=opts||{};
  const c=BANK_INDEX.c[id];if(!c)return Promise.reject(new Error('no clip'));
  return bankLoad(c[0]).then(buf=>new Promise(resolve=>{
    const ctx=actx();const rate=clamp(opts.rate||ST.rate||1,0.6,1.4);
    const src=ctx.createBufferSource();src.buffer=buf;src.playbackRate.value=rate;
    const start=Math.max(0,c[1]-0.02),dur=Math.min(buf.duration-start,c[2]+0.08),len=dur/rate;
    let t0=ctx.currentTime+0.04;

      const hp=ctx.createBiquadFilter();hp.type='highpass';hp.frequency.value=420;

      const ws=ctx.createWaveShaper();ws.curve=clipCurve(opts.garble?14:6);

      const out=ctx.createGain();out.gain.value=0.85;
      src.connect(hp);hp.connect(pk);pk.connect(ws);ws.connect(lp);lp.connect(out);out.connect(ctx.destination);
      radioBurst(ctx,t0,0.09,0.16);t0+=0.1;
      const bed=ctx.createBufferSource();bed.buffer=noiseBuf(ctx,len+0.2);const bf=ctx.createBiquadFilter();bf.type='bandpass';bf.frequency.value=1600;bf.Q.value=0.5;
      const bg=ctx.createGain();bg.gain.value=opts.garble?0.08:0.035;bed.connect(bf);bf.connect(bg);bg.connect(ctx.destination);bed.start(t0);bed.stop(t0+len+0.1);BANK.cur.push(bed);
      if(opts.garble){let t=t0+0.5;while(t<t0+len-0.4){const d=0.18+Math.random()*0.35;out.gain.setValueAtTime(0.85,t);out.gain.linearRampToValueAtTime(0.02,t+0.03);out.gain.setValueAtTime(0.02,t+d);out.gain.linearRampToValueAtTime(0.85,t+d+0.03);bg.gain.setValueAtTime(0.25,t);bg.gain.setValueAtTime(0.08,t+d);t+=d+0.5+Math.random()*0.6;}}
      radioBurst(ctx,t0+len+0.02,0.2,0.13);
    }else src.connect(ctx.destination);
    src.start(t0,start,dur);BANK.cur.push(src);
    let done=false;const fin=ok=>{if(done)return;done=true;resolve(ok);};
    src.onended=()=>setTimeout(()=>fin(true),opts.radio?260:0);

}
/* items: [{id, t, v}] en orden; si falla el banco, sigue con la voz del dispositivo */
function bankSeq(items,opts){
  opts=opts||{};
  hush();const g=++TTS.gen;
  return new Promise(async resolve=>{
    setWave(true);TTS.speaking=true;
    for(let i=0;i<items.length;i++){
      if(g!==TTS.gen){resolve(false);return;}
      try{await bankPlay(items[i].id,opts);}
      catch(e){if(g!==TTS.gen){resolve(false);return;}const rest=items.slice(i).map(x=>({t:x.t,v:x.v||'A'}));setWave(false);resolve(await _speakLinesTTS(rest,opts));return;}
      if(i<items.length-1)await new Promise(r=>setTimeout(r,opts.gap||220));
    }
    if(g===TTS.gen){TTS.speaking=false;setWave(false);}
    resolve(g===TTS.gen);
  });
}
const _speakLinesTTS=speakLines,_hushTTS=hush;
hush=function(){bankStop();_hushTTS();};
speakLines=function(lines,opts){
  opts=opts||{};

    const items=lines.map(l=>{const k=bankKey(sub(l.t));const v=BANK.txt.get(k);let id=null;
      if(v&&v.startsWith('chunk:'))id=(opts.slow?'s:':'c:')+v.slice(6);else if(v)id=v;else{const w=BANK.txt.get('w '+k);if(w)id=w;}
      return id&&bankHas(id)?{id,t:l.t,v:l.v}:null;});
    if(items.length&&items.every(Boolean))return bankSeq(items,Object.assign({},opts,{rate:opts.slow&&items[0].id.startsWith('w:')?0.85:null}));
  }

};

function playIds(items,opts){

function orPick(list){

async function orCall(messages,opts){
  opts=opts||{};
  if(!OR.key)throw {code:'not_granted',message:'Falta la clave de OpenRouter'};
  const body={model:OR.model,messages,temperature:opts.temperature==null?0.7:opts.temperature};
  let r;
  try{r=await fetch('https://openrouter.ai/api/v1/chat/completions',{method:'POST',signal:opts.signal,headers:{'Authorization':'Bearer '+OR.key,'Content-Type':'application/json','X-Title':'Control Room English'},body:JSON.stringify(body)});}
  catch(e){if(e&&e.name==='AbortError')throw {code:'cancelled'};throw {code:'network',message:'Sin conexión con OpenRouter'};}
  if(r.status===401||r.status===403)throw {code:'not_granted',message:'OpenRouter rechazó la clave'};
  if(r.status===429)throw {code:'rate_limited'};
  if(r.status===402)throw {code:'rate_limited',message:'Límite gratuito agotado'};
  if(!r.ok)throw {code:'error',message:'OpenRouter respondió '+r.status};
  const j=await r.json();

  if(!t.trim())throw {code:'error',message:'Respuesta vacía'};

  return {text:t,truncated:false};
}

function tagDrill(box){
  const T={q:shuffle(TAGS.map((_,i)=>i)).slice(0,5),i:0,ok:0,state:'ask',said:''};
  const draw=()=>{
    if(T.i>=T.q.length){box.innerHTML=`<div class="fb ${T.ok>=4?'ok':T.ok>=3?'near':'bad'}"><h3>${T.ok} de ${T.q.length} tags copiados</h3><button class="btn" type="button" id="tgAgain">Otra ronda</button></div>`;$('#tgAgain').onclick=()=>tagDrill(box);return;}
    const k=T.q[T.i],tg=TAGS[k];
    box.innerHTML=`<div class="row"><button class="btn radio" type="button" id="tgPlay">${ICON.play}Escuchar el tag ${T.i+1} de ${T.q.length}</button></div>
      ${T.state==='ask'?`<div class="row"><input id="tgIn" class="tagin" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Por ejemplo: PC201" aria-label="Tag que escuchaste"><button class="btn primary" type="button" id="tgOk">Comprobar</button></div>`:
      `<div class="fb ${T.res?'ok':'bad'}"><p style="margin:0"><b>${T.res?'Correcto':'No era ese'}</b>: el tag es <b class="mono">${esc(tg[0])}</b> (${esc(tg[1])}).${T.res?'':' Escribiste: '+esc(T.said||'—')+'.'}</p><div class="row" style="margin-top:8px"><button class="btn primary" type="button" id="tgNext">Siguiente</button></div></div>`}`;
    $('#tgPlay').onclick=()=>playIds([{id:'t:'+k,t:tg[1]}],{radio:true});
    const ok=$('#tgOk');if(ok){const inp=$('#tgIn');const chk=()=>{const a=(inp.value||'').toUpperCase().replace(/[^A-Z0-9]/g,''),b=tg[0].replace(/[^A-Z0-9]/g,'');T.said=inp.value;T.res=a===b;if(T.res)T.ok++;T.state='fb';draw();};ok.onclick=chk;inp.onkeydown=e=>{if(e.key==='Enter')chk();};}
    const nx=$('#tgNext');if(nx)nx.onclick=()=>{T.i++;T.state='ask';draw();setTimeout(()=>{const p=$('#tgPlay');if(p)p.click();},150);};
  };
  draw();
}
const RR={};
SCREENS.radioRun=(m,p)=>{
  const r=RADIO.find(x=>x.id===(p&&p.id))||RADIO[0];
  Object.assign(RR,{r,i:0,phase:'rx',log:[],scores:[],tries:0,show:{},fb:null});
  const back=()=>go('radio');
  const voiceOf=s=>(s.v||r.v||'').startsWith('af')?'A':'B';
  const draw=()=>{
    const s=r.steps[RR.i];
    const lg=RR.log.map((l,k)=>`<div class="rl ${l.who==='you'?'tx':'rx'}"><span class="eyebrow">${l.who==='you'?'TX · '+esc(r.you):'RX · '+esc(l.from)}</span>${l.who==='you'||!ST.listenFirst||RR.show[k]?`<div>${esc(l.t)}</div>`:''}${l.who!=='you'?`<div class="row" style="gap:14px;margin-top:2px">${ST.listenFirst&&!RR.show[k]?`<button class="link" type="button" data-show="${k}">Ver lo que dijo</button>`:''}<button class="link" type="button" data-again="${l.step}">Repetir transmisión</button></div>`:''}</div>`).join('');
    let act='';
    if(RR.phase==='end'){
      const sc=RR.scores.length?RR.scores.reduce((a,b)=>a+b,0)/RR.scores.length:0;
      act=`<div class="fb ${sc>=0.8?'ok':sc>=0.6?'near':'bad'}"><h3>Llamada terminada · ${fmt(100*sc)} % del protocolo</h3><p>${sc>=0.8?'Comunicación clara: un operador en Arizona te entendería a la primera.':sc>=0.6?'Se entiende, pero faltaron elementos del protocolo. Repite la llamada con la respuesta modelo en mente.':'Repite la llamada: escucha la respuesta modelo de cada paso antes de transmitir.'}</p>
        <div class="row"><button class="btn primary" type="button" id="rrAgain">Repetir la llamada</button><button class="btn" type="button" id="rrBack">Otras llamadas</button></div></div>`;
    }else if(RR.phase==='fb'){
      const f=RR.fb;
      act=`<div class="fb ${f.score>=0.85?'ok':f.score>=0.6?'near':'bad'}"><h3>${f.score>=0.85?'Bien':'Revisa'} · ${fmt(100*f.score)} %</h3>
        <ul class="ck">${f.checks.map(c=>`<li class="${c[1]?'ok':'no'}">${c[1]?'✓':'✗'} ${esc(c[0])}</li>`).join('')}</ul>${f.tips.map(t=>`<p class="small">${esc(t)}</p>`).join('')}
        <div class="task"><span class="eyebrow">Respuesta modelo</span><div>${esc(s.model)}</div></div>
        <div class="row"><button class="btn radio" type="button" id="rrModel">${ICON.play}Escuchar el modelo</button>${f.score<0.85?'<button class="btn" type="button" id="rrRetry">Transmitir otra vez</button>':''}<button class="btn primary" type="button" id="rrNext">Continuar</button></div></div>`;
    }else if(RR.phase==='tx'){
      act=`<div class="task"><span class="eyebrow">Te toca · eres ${esc(r.you)}</span><div>${esc(s.do||('Responde a '+(s.from||r.them)+' siguiendo el protocolo.'))}</div></div>${txHTML('rrIn','Toca aquí y transmite en inglés')}
        <div class="row"><button class="btn primary ptt" type="button" id="rrSend">${ICON.radio}Transmitir</button><span class="small">Mantén los mensajes cortos. Termina con over (esperas respuesta) u out (cierras).</span></div>`;
    }else act=`<div class="row"><button class="btn radio" type="button" id="rrPlay">${ICON.play}${s.say?'Recibir transmisión':'Continuar'}</button></div>`;
    m.innerHTML=`<div class="stack"><button class="btn ghost" type="button" id="rrBk" style="align-self:flex-start">${ICON.back}Radio</button>
      <div class="rhead"><div class="lcd"><span>CH 3</span><b>${esc(r.them)}</b><span class="rxtx ${RR.phase==='tx'?'on':''}">${RR.phase==='tx'?'TX':'RX'}</span>${waveHTML()}</div>
      <div><span class="eyebrow">${r.lv} · ${esc(areaName(r.area))}</span><h2>${esc(r.t)}</h2><p class="lead" style="margin:4px 0 0">${esc(r.setup)}</p></div></div>
      <div class="rgrid"><div class="card stack"><div class="rlog">${lg||'<p class="small" style="margin:0">El canal está en silencio. Toca Recibir transmisión.</p>'}</div>${act}</div>
      <div class="card minimap">${plantSVG({hl:r.area,mini:true,pulse:true,dim:true})}<p class="small" style="margin:6px 0 0">${esc(r.them)} llama desde: <b>${esc(areaName(r.area))}</b></p></div></div></div>`;
    $('#rrBk').onclick=back;
    m.querySelectorAll('[data-show]').forEach(b=>b.onclick=()=>{RR.show[+b.dataset.show]=true;draw();});
    m.querySelectorAll('[data-again]').forEach(b=>b.onclick=()=>{const k=+b.dataset.again,st=r.steps[k];playIds([{id:'r:'+r.id+':'+k,t:st.say,v:voiceOf(st)}],{radio:true,garble:st.garble});});
    const pl=$('#rrPlay');if(pl)pl.onclick=async()=>{
      if(s.say){RR.log.push({who:'them',from:s.from||r.them,t:s.say,step:RR.i});
        RR.phase=s.end?'end':(s.need?'tx':'rx');draw();
        await playIds([{id:'r:'+r.id+':'+RR.i,t:s.say,v:voiceOf(s)}],{radio:true,garble:s.garble});
        if(s.end){finish();}
      }else{RR.phase='tx';draw();}
    };
    if(RR.phase==='rx'&&!s.say&&s.need){RR.phase='tx';draw();return;}
    const sd=$('#rrSend');if(sd){const tx=wireTx('rrIn');sd.addEventListener('pointerdown',()=>pttSound());sd.onclick=()=>{const said=tx.box.value.trim();if(!said){tx.box.focus();return;}squelchSound();evalStep(said);};}
    const md=$('#rrModel');if(md)md.onclick=()=>playIds([{id:'r:'+r.id+':'+RR.i+':m',t:s.model,v:'B'}]);
    const rt=$('#rrRetry');if(rt)rt.onclick=()=>{RR.tries++;RR.log.pop();RR.phase='tx';draw();};
    const nx=$('#rrNext');if(nx)nx.onclick=()=>{RR.i++;RR.tries=0;RR.phase='rx';draw();const s2=r.steps[RR.i];if(s2&&s2.say)setTimeout(()=>{const p2=$('#rrPlay');if(p2)p2.click();},120);};
    const ag=$('#rrAgain');if(ag)ag.onclick=()=>go('radioRun',{id:r.id});
    const bb=$('#rrBack');if(bb)bb.onclick=back;
    const lastEl=m.querySelector('.rlog');if(lastEl)lastEl.scrollTop=lastEl.scrollHeight;
  };
  const evalStep=said=>{
    const s=r.steps[RR.i];noteSpoke(said);
    const t=' '+norm(said).join(' ')+' ';
    const checks=s.need.map(([lab,re])=>[lab,new RegExp(re).test(t.trim())]);
    let score=checks.filter(c=>c[1]).length/checks.length;
    const tips=[];
    if(/ over and out /.test(t)){tips.push('En radio no se dice «over and out»: over pide respuesta y out cierra. Usa uno solo.');score=Math.max(0,score-0.1);}
    if(/ repeat /.test(t)&&!/ say again /.test(t))tips.push('Para pedir que repitan se dice «say again». «Repeat» se reserva para otros usos en radio.');
    if(norm(said).length>45)tips.push('Mensaje largo: en radio, una idea por transmisión.');
    RR.log.push({who:'you',t:said});
    if(RR.tries===0)RR.scores[RR.i]=score;else RR.scores[RR.i]=Math.max(RR.scores[RR.i]||0,score*0.9);
    RR.fb={score,checks,tips};RR.phase='fb';draw();
  };
  const finish=()=>{
    const sc=RR.scores.filter(x=>x!=null),avg=sc.length?sc.reduce((a,b)=>a+b,0)/sc.length:0;
    const prev=ST.radio[r.id]||{};ST.radio[r.id]={best:Math.max(prev.best||0,avg),n:(prev.n||0)+1,at:Date.now()};save();
    RR.phase='end';draw();
  };
  draw();
  bankPreload('r:'+r.id+':');
};

const TF={};

function tfShuffleQ(q){const o=q[1].map((t,i)=>({t,ok:i===0}));return {q:q[0],o:shuffle(o)};}
function tfCW(text){
  /* Complete the Words: desde la segunda oración, una palabra sí y una no (de 3 letras o más) pierde su segunda mitad */
  const parts=text.split(/(\s+)/);let sent=0,flip=false,gaps=[];
  const out=parts.map(tok=>{
    if(/^\s+$/.test(tok))return {sp:tok};
    const m=tok.match(/^([“"'(]*)([A-Za-z][A-Za-z'’-]*)([^A-Za-z]*)$/);
    const endS=/[.!?]["”')]*$/.test(tok);
    let r={w:tok};
    if(sent>=1&&m&&m[2].length>=3&&!/^[A-Z]/.test(m[2])&&!/['’-]/.test(m[2])){flip=!flip;if(flip&&gaps.length<10){const w=m[2],k=Math.floor(w.length/2);r={pre:m[1],show:w.slice(0,k),miss:w.slice(k),post:m[3],g:gaps.length};gaps.push(w);}}
    if(endS)sent++;
    return r;
  });
  return {out,gaps};
}
function tfBuild(u){
  const x=EXU[u.id];if(!x)return null;

  const bsPool=shuffle(ch.filter(c=>{const n=c.en.split(/\s+/).length;return n>=4&&n<=14;})).slice(0,3);
  const bs=bsPool.map(c=>{const ws=c.en.replace(/[.?!]$/,'').split(/\s+/);let sh=shuffle(ws.map((w,k)=>({w,k})));if(sh.every((o,k)=>o.k===k))sh=sh.reverse();return {en:c.en,es:c.es,ws,sh,pick:[]};});
  const lr=shuffle(ch).slice(0,5).sort((a,b)=>a.en.length-b.en.length);
  return {u,x,lcr:x.lcr.map(tfShuffleQ),lsq:x.ls.q.map(tfShuffleQ),rdq:x.rd.q.map(tfShuffleQ),cw:tfCW(x.cw),bs,lr,
    sec:'intro',step:0,a:{lcr:[],ls:[],rd:[],cw:[],bs:[],em:'',lr:[],iv:[]},plays:{},lsDone:false,ai:null,aiErr:'',busy:false};
}

function tfLocal(S){
  const x=S.x;
  const lcrOk=S.lcr.map((q,k)=>S.a.lcr[k]!=null&&q.o[S.a.lcr[k]].ok);
  const lsOk=S.lsq.map((q,k)=>S.a.ls[k]!=null&&q.o[S.a.ls[k]].ok);
  const rdOk=S.rdq.map((q,k)=>S.a.rd[k]!=null&&q.o[S.a.rd[k]].ok);
  const cwOk=S.cw.gaps.map((w,g)=>{const a=(S.a.cw[g]||'').trim().toLowerCase(),k=Math.floor(w.length/2);return a===w.slice(k).toLowerCase()||a===w.toLowerCase();});
  const bsOk=S.bs.map(b=>b.pick.map(k=>b.ws[k]).join(' ').toLowerCase()===b.ws.join(' ').toLowerCase());
  const lrSc=S.a.lr.map(r=>r?r.score:0);
  const avg=a=>a.length?a.reduce((p,q)=>p+(q===true?1:q===false?0:q),0)/a.length:0;
  const L=(lcrOk.filter(Boolean).length+lsOk.filter(Boolean).length)/7;
  const R=0.5*avg(cwOk)+0.5*avg(rdOk);
  return {lcrOk,lsOk,rdOk,cwOk,bsOk,lrSc,L,R,bsP:avg(bsOk),lrP:avg(lrSc)};
}
function tfScores(S){
  const lo=tfLocal(S),ai=S.ai;
  let emP=null,ivP=null;
  if(ai&&ai.email)emP=clamp(Number(ai.email.score)||0,0,5)/5;
  else if(S.self){emP=['0','1','2'].filter(k=>S.self[k]).length/3*0.8;}
  if(ai&&ai.interview)ivP=clamp(Number(ai.interview.score)||0,0,5)/5;
  const W=emP==null?lo.bsP:0.4*lo.bsP+0.6*emP;
  const Sp=ivP==null?lo.lrP:0.4*lo.lrP+0.6*ivP;
  const secs={L:lo.L,R:lo.R,W,S:Sp};
  const lv=S.u.lv,bands=Object.fromEntries(Object.entries(secs).map(([k,v])=>[k,tfBand(v,lv)]));
  const overall=(secs.L+secs.R+secs.W+secs.S)/4,band=Math.round((bands.L+bands.R+bands.W+bands.S)/4*2)/2;
  const pass=overall>=0.7&&Object.values(secs).every(v=>v>=0.5);
  return {lo,secs,bands,overall,band,pass,emP,ivP};
}
function tfSave(S){
  const sc=tfScores(S),uid=S.u.id,prev=ST.uexam[uid]||{};
  if(!S.saved){S.saved=true;ST.uexam[uid]={best:Math.max(prev.best||0,sc.overall),band:Math.max(prev.band||0,sc.band),pass:!!(prev.pass||sc.pass),n:(prev.n||0)+1,at:Date.now(),last:Math.round(100*sc.overall)};}
  else{const c=ST.uexam[uid];c.best=Math.max(c.best||0,sc.overall);c.band=Math.max(c.band||0,sc.band);c.pass=!!(c.pass||sc.pass);c.last=Math.round(100*sc.overall);}
  save();
}
async function tfGrade(S,draw){
  S.sec='grade';draw();
  if(aiOn()){
    const lv=S.u.lv,x=S.x;
    const ivs=x.iv.map((q,k)=>`Q${k+1}: ${q}\nAnswer (${(S.a.iv[k]||{}).secs||0} s): """${(S.a.iv[k]||{}).said||'(no answer)'}"""`).join('\n\n');
    const prompt=`You are a TOEFL iBT (2026 format) rater for the Writing "Write an Email" task and the Speaking "Take an Interview" task. The test is pitched at CEFR ${lv}.\n${PROFILE}\nSpeaking answers are speech-to-text transcripts: ignore punctuation, capitalization and obvious recognition slips; judge content, organization, vocabulary and grammar from the words, and fluency only from length and connectedness.\n\nEMAIL TASK\nTo: ${x.em.to}\nSituation: ${x.em.sit}\nThe email must: ${x.em.pts.join('; ')}.\nLearner's email: """${S.a.em}"""\n\nINTERVIEW (45 seconds per answer)\n${ivs}\n\nScore each task from 0 to 5, where 3 means it meets CEFR ${lv} for this task, 4 is clearly above, 5 is excellent for ${lv}, 2 is below, 0 is no answer. Reply with only this JSON:\n{"email":{"score":0,"cefr":"A1|A2|B1|B2|C1|C2","points_done":[true,true,true],"feedback_es":"two sentences in Spanish","better":"an improved version of the learner's email, same ideas, at ${lv} level"},"interview":{"score":0,"cefr":"A1|A2|B1|B2|C1|C2","feedback_es":"two sentences in Spanish","fixes":[{"said":"exact learner words","better":"corrected version","why_es":"short reason in Spanish"}]},"summary_es":"two sentences in Spanish: the main strength and what to practice next"}\nAt most 4 fixes.`;
    try{S.ai=await aiJSON(prompt,'default');S.aiErr='';}catch(e){S.ai=null;S.aiErr=aiErr(e)||'No se pudo evaluar.';}
  }
  S.sec='res';tfSave(S);
  const sc=tfScores(S);
  ST.evals.push({at:Date.now(),type:'unidad',lv:S.u.lv,cefr:tfCefr(sc.band),avg:Math.round(sc.overall*50)/10,u:S.u.id});ST.evals=ST.evals.slice(-60);save();
  draw();window.scrollTo(0,0);
}
function tfResults(S){

  const qRev=(qs,ans,oks)=>qs.map((q,k)=>`<div class="rv"><b>${esc(q.q)}</b> ${mark(oks[k])}<div class="small">Tu respuesta: ${ans[k]!=null?esc(q.o[ans[k]].t):'—'}${oks[k]?'':' · Correcta: '+esc(q.o.find(o=>o.ok).t)}</div></div>`).join('');
  const secRow=(k,n)=>`<div><span class="eyebrow">${n}</span><b>${fmt(sc.bands[k],1)}</b><small>${fmt(100*sc.secs[k])} % · ${tfCefr(sc.bands[k])}</small></div>`;

    ${S.aiErr?`<div class="fb bad"><p style="margin:0">${esc(S.aiErr)}</p><button class="btn" type="button" id="tfRetryAI" style="margin-top:8px">Evaluar otra vez</button></div>`:''}
    ${ai&&ai.summary_es?`<p>${esc(ai.summary_es)}</p>`:''}</div>
  <details class="card" open><summary><b>Listening</b> · ${fmt(100*sc.secs.L)} %</summary><div class="stack" style="margin-top:10px">
    ${S.lcr.map((q,k)=>`<div class="rv"><button class="link" type="button" data-rp="lcr${k}">Escuchar</button> <i>${esc(x.lcr[k][0])}</i> ${mark(lo.lcrOk[k])}<div class="small">Mejor respuesta: ${esc(q.o.find(o=>o.ok).t)}</div></div>`).join('')}
    <div class="row"><button class="btn radio" type="button" data-rp="ls">${ICON.play}Escuchar el audio otra vez</button></div>
    <div class="doc">${x.ls.lines.map(l=>esc(l[1])).join('\n')}</div>${qRev(S.lsq,S.a.ls,lo.lsOk)}</div></details>
  <details class="card"><summary><b>Reading</b> · ${fmt(100*sc.secs.R)} %</summary><div class="stack" style="margin-top:10px">
    <p class="cw">${S.cw.out.map(t=>t.sp!=null?t.sp:t.g!=null?`${esc(t.pre)}<span class="${lo.cwOk[t.g]?'w ok':'w sub'}">${esc(t.show)}${lo.cwOk[t.g]?esc(t.miss):'<s>'+esc(S.a.cw[t.g]||'_')+'</s>'+esc(t.miss)}</span>${esc(t.post)}`:esc(t.w)).join('')}</p>${qRev(S.rdq,S.a.rd,lo.rdOk)}</div></details>

      :`<p class="small">${aiOn()?'Sin evaluación de la IA.':'Sin IA disponible: marca lo que sí incluiste.'}</p>${x.em.pts.map((t,i)=>`<label class="toggle"><input type="checkbox" data-self="${i}"${S.self&&S.self[i]?' checked':''}><span>${esc(t)}</span></label>`).join('')}`}</div></div></details>

      <div class="row"><button class="btn primary" type="button" id="orGo">Conectar y buscar modelos gratis</button>${OR.key?'<button class="btn ghost" type="button" id="orDel">Borrar clave</button>':''}</div>
      <div id="orModels">${OR.model?`<p class="small" style="margin:0">Modelo activo: <b class="mono">${esc(OR.model)}</b></p>`:''}</div><p class="small" id="orMsg" style="margin:0">${esc(OR.msg)}</p>
      <p class="small" style="margin:0">Límites gratuitos de OpenRouter: 20 consultas por minuto; 50 por día si nunca compraste créditos y 1000 por día si compraste al menos 10. Una conversación usa una consulta por turno; un examen de unidad, una.</p>`
    :`<h3>Motor de IA</h3><p class="lead" style="margin:0">Aquí las conversaciones y evaluaciones las hace <b>Claude</b>, sin pago adicional: usa el límite de tu cuenta de Claude.</p>
      <p class="small" style="margin:0">La página publicada en claude.ai no puede conectarse a otros servicios como OpenRouter: la seguridad de claude.ai bloquea esas conexiones. Para usar un modelo gratuito de OpenRouter, abre la copia local de la app (el archivo .html) en el navegador de tu computadora y configura tu clave en sus Ajustes.</p>`;
  host.parentNode.insertBefore(c1,host);host.parentNode.insertBefore(c2,host);
  const hf=$('#sHifi');if(hf)hf.onchange=e=>{ST.hifi=e.target.checked;save();};
  const ht=$('#sHifiT');if(ht)ht.onclick=()=>playIds([{id:'c:a1u2-3',t:'The mill processes two thousand tonnes per hour.'}]);
  const rt=$('#sRadioT');if(rt)rt.onclick=()=>playIds([{id:'r:ra3:0',t:'Field Two, this is Control, over.'}],{radio:true});
  if(loc){
    const drawModels=()=>{const box=$('#orModels');if(!OR.models.length)return;box.innerHTML=`<label class="fld">Modelo gratuito (${OR.models.length} disponibles)<select id="orSel">${OR.models.map(x=>`<option value="${esc(x.id)}"${x.id===OR.model?' selected':''}>${esc(x.name)}</option>`).join('')}</select></label>`;$('#orSel').onchange=e=>{OR.model=e.target.value;lsSet('cre_or_model',OR.model);AI.fn=makeOrFn();AI.name='OpenRouter';AI.off=false;AI.why='';};};
    drawModels();
    $('#orGo').onclick=async()=>{
      const k=($('#orKey').value||'').trim();const msg=$('#orMsg');
      if(!k){msg.textContent='Pega tu clave primero.';return;}
      OR.key=k;lsSet('cre_or_key',k);msg.textContent='Buscando modelos gratuitos…';
      try{OR.models=await orModels();if(!OR.models.length)throw new Error('none');if(!OR.models.some(x=>x.id===OR.model))OR.model=orPick(OR.models);lsSet('cre_or_model',OR.model);
        AI.fn=makeOrFn();AI.name='OpenRouter';AI.off=false;AI.why='';drawModels();
        msg.textContent='Probando la clave…';const r=await AI.fn('Reply with the single word: ready',{temperature:0});OR.msg='Conectado. El modelo respondió: '+r.text.trim().slice(0,40);msg.textContent=OR.msg;}
      catch(e){OR.msg=e&&e.message==='none'?'OpenRouter no tiene modelos gratuitos disponibles ahora.':(aiErr(e)||'No se pudo conectar con OpenRouter.');msg.textContent=OR.msg;}
    };
    const dl=$('#orDel');if(dl)dl.onclick=()=>{OR.key='';OR.model='';OR.models=[];OR.msg='';lsSet('cre_or_key','');lsSet('cre_or_model','');AI.fn=null;AI.why='Configura tu clave de OpenRouter en Ajustes.';render();};
  }
};

(function boot(){
  const th=lsGet('cre_theme','');if(th)document.documentElement.setAttribute('data-theme',th);
  go('hoy');
  initAI();initCloud();
})();
</script>
